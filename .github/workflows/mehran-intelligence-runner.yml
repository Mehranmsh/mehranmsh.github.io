                  if (!file || typeof file.path !== "string" || !allowedPaths.has(file.path) || seen.has(file.path) ||
                      typeof file.blobSha !== "string" || !/^[a-f0-9]{40}$/i.test(file.blobSha) ||
                      !Number.isInteger(file.bytes) || file.bytes < 0 || file.bytes > 700000 ||
                      !Number.isInteger(file.lineCount) || file.lineCount < 0 || file.lineCount > 20000 ||
                      !Array.isArray(file.symbols) || file.symbols.length > 2 ||
                      file.symbols.some(symbol => typeof symbol !== "string" || symbol.length > 60)) return false;
                  seen.add(file.path);
                  totalBytes += file.bytes;
                  return true;
                });
                const analysis = report?.analysis && typeof report.analysis === "object" ? report.analysis : {};
                const analysisValid = typeof analysis.summary === "string" && analysis.summary.length <= 1600 &&
                  Array.isArray(analysis.findings) && analysis.findings.length <= 8 &&
                  analysis.findings.every(item => item && ["critical","high","medium","low","info"].includes(item.severity) &&
                    typeof item.title === "string" && item.title.length <= 180 &&
                    typeof item.rootCause === "string" && item.rootCause.length <= 1200 &&
                    typeof item.recommendation === "string" && item.recommendation.length <= 1200 &&
                    Array.isArray(item.evidence) && item.evidence.length <= 5 &&
                    item.evidence.every(ev => ev && seen.has(ev.path) && typeof ev.quote === "string" && ev.quote.length <= 500) &&
                    Array.isArray(item.regressionTests) && item.regressionTests.length <= 6 &&
                    item.regressionTests.every(item => typeof item === "string" && item.length <= 300)) &&
                  Array.isArray(analysis.limitations) && analysis.limitations.length <= 5 &&
                  analysis.limitations.every(item => typeof item === "string" && item.length <= 300);
                checkpointMatchesCurrentSchema = checkpointMatchesCurrentSchema && report?.type === "inspect_repository" &&
                  report?.mode === "bounded_read_only_repository_inspection" &&
                  report?.repository === "Mehranmsh/mehranmsh.github.io" &&
                  typeof report?.commitSha === "string" && /^[a-f0-9]{40}$/i.test(report.commitSha) &&
                  filesValid && totalBytes <= 750000 &&
                  report?.summary?.filesInspected === files.length &&
                  report?.summary?.totalBytes === totalBytes && analysisValid;
              } catch {
                checkpointMatchesCurrentSchema = false;
              }
              if (!checkpointMatchesCurrentSchema) {
                console.log("Ignoring stale repository-inspection checkpoint; current Worker schema requires bounded evidence-backed semantic analysis.");
              }
            }
            if (savedCheckpoint.phase === "result_ready" && task.actionType === "source_security_audit") {
              try {
                const checkpointReport = JSON.parse(savedCheckpoint.result || "null");
                checkpointMatchesCurrentSchema = checkpointMatchesCurrentSchema && checkpointReport?.type === "source_security_audit" &&
                  checkpointReport?.mode === "deterministic_read_only_static_audit";
              } catch {
                checkpointMatchesCurrentSchema = false;
              }
              if (!checkpointMatchesCurrentSchema) {
                console.log("Ignoring stale source-security-audit checkpoint; current Worker schema requires deterministic_read_only_static_audit.");
              }
            }
            if (savedCheckpoint.phase === "result_ready" && task.actionType === "propose_code_patch") {
              try {
                const patchReport = JSON.parse(savedCheckpoint.result || "null");
                const payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload || "{}") : (task.actionPayload || {});
                const expectedDigest = createHash("sha256")
                  .update(String(patchReport?.baseSha || "") + "\n" + String(payload?.objective || "").trim() + "\n" + String(payload?.targetPath || ""))
                  .digest("base64url");
                checkpointMatchesCurrentSchema = checkpointMatchesCurrentSchema && patchReport?.type === "propose_code_patch" &&
                  patchReport?.requestId === task.id && patchReport?.targetPath === payload?.targetPath && patchReport?.applied === false &&
                  /^[a-f0-9]{40}$/.test(patchReport?.baseSha || "") &&
                  savedCheckpoint.baseSha === patchReport.baseSha &&
                  patchReport?.requestHash === expectedDigest;
              } catch {
                checkpointMatchesCurrentSchema = false;
              }
              if (!checkpointMatchesCurrentSchema) {
                console.log("Ignoring stale patch-proposal checkpoint; immutable task objective, request ID, or base commit did not match.");
              }
            }
            if (savedCheckpoint.phase === "result_ready" &&
                savedCheckpoint.actionType === task.actionType &&
                typeof savedCheckpoint.result === "string" &&
                savedCheckpoint.result.length > 0 && savedCheckpoint.result.length <= 3000 &&
                checkpointMatchesCurrentSchema &&
                ["completed","blocked"].includes(savedCheckpoint.status)) {
              result = savedCheckpoint.result;
              status = savedCheckpoint.status;
              resumedFromCheckpoint = true;
              console.log("Resuming task " + task.id + " from its durable result checkpoint; execution will not be repeated.");
            }
            const executionStartedAt = Date.now();
            try {
              if (!resumedFromCheckpoint) {
                const executionResult = await execute(task);
                if (task.actionType === "run_repository_tests" && executionResult?.passed !== true) status = "blocked";
                result = serializeBoundedResult(executionResult);
                if (status === "completed") {
                  const resultReport = JSON.parse(result);
                  const checkpoint = {
                    phase: "result_ready",
                    actionType: task.actionType,
                    status,
                    ...(task.actionType === "propose_code_patch" && /^[a-f0-9]{40}$/.test(resultReport?.baseSha || "")
                      ? { baseSha: resultReport.baseSha } : {}),
                    result,
                    resultSha256: createHash("sha256").update(result).digest("hex"),
                    preparedAt: new Date().toISOString()
                  };
                  const saved = await request(`/agent/v1/tasks/${encodeURIComponent(task.id)}/checkpoint`, {
                    method: "POST",
                    body: JSON.stringify({ checkpoint, claimToken: task.claimToken })
                  });
                  if (saved.checkpointSaved !== true) throw new Error("Completed task result could not be durably checkpointed.");
                  console.log("Durable result checkpoint saved for task " + task.id + ".");
                }
              }
            } catch (error) {
              status = "blocked";
              const isWorkersAIInferenceFailure = error?.safeDiagnostic?.stage === "workers_ai_inference";
              retryable = !isWorkersAIInferenceFailure && (
                Number(error?.status) === 503 ||
                error?.name === "TimeoutError" || error?.name === "AbortError" ||
                (task.actionType === "propose_code_patch" &&
                  Number(error?.status) === 409 && /already in progress|concurrently reserved/i.test(String(error?.message || "")))
              );
              if (isWorkersAIInferenceFailure) {
                console.log("Workers AI inference failure is recorded as non-retryable; preventing repeated provider calls.");
              }
              const diagnostic = String(error?.message || error).slice(0,300);
              console.log(`Bounded task diagnostic (${task.actionType}): ${diagnostic}`);
              if (error?.safeDiagnostic) console.log("Bounded safe diagnostic: " + JSON.stringify(error.safeDiagnostic));
              const safeDiagnosticText = error?.safeDiagnostic
                ? ` Safe diagnostic: ${JSON.stringify(error.safeDiagnostic)}`
                : "";
              result = (`Bounded runner failed: ${diagnostic}` + safeDiagnosticText).slice(0, 3000);
            }
            recordTiming(`task_execute:${task.actionType}`, executionStartedAt);
            await request(`/agent/v1/tasks/${encodeURIComponent(task.id)}/result`, {
              method: "POST",
              body: JSON.stringify({ status, result, retryable, claimToken: task.claimToken })
            });
            console.log(`Bounded task ${count + 1} finished with status: ${status}; retryable=${retryable}; resumedFromCheckpoint=${resumedFromCheckpoint}`);
          }

          if (Date.now() >= taskExecutionDeadline) {
            console.log("Task execution budget reached; remaining eligible tasks stay queued for the next scheduled tick.");
          }

          // Re-discover terminal packages on every tick so a crash after task-result
          // commit cannot permanently skip private report finalization.
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            try {
              const pending = await request("/agent/v1/work-packages/pending-finalization", {}, ownerHeaders);
              for (const id of (Array.isArray(pending.workPackageIds) ? pending.workPackageIds : [])) {
                if (typeof id === "string" && id.length > 0 && id.length <= 160) packageIds.add(id);
              }
            } catch (error) {
              console.log("Pending work-package finalization discovery unavailable: " + String(error?.message || error).slice(0,180));
            }
          }

          // Finalize every package touched by this tick, including missions submitted from the owner UI.
          if (packageIds.size && orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            for (const workPackageId of packageIds) {
              const finalState = await request(`/agent/v1/work-packages/${encodeURIComponent(workPackageId)}`, {}, ownerHeaders);
              console.log("Work package " + workPackageId + " final status: " + (finalState.workPackage?.status || "unknown"));
              console.log("Private report storage: " + (finalState.reportStorage?.stored ? "stored" : "not stored") + "; path=" + (finalState.reportStorage?.path || "none") + "; reason=" + (finalState.reportStorage?.reason || "none"));
            }
          }
          // Archive owner-private notifications through the Worker, which holds the private-repository credential.
          // The Actions runner receives only a lease; it never receives the reports-repository token or payload.
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            for (let count = 0; count < 10 && Date.now() < taskExecutionDeadline; count++) {
              let notification;
              try {
                const claimed = await request("/agent/v1/notifications/next", {}, ownerHeaders, 15000);
                notification = claimed?.notification;
                if (!notification) break;
                if (notification.channel !== "owner_private" || typeof notification.id !== "string" ||
                    typeof notification.leaseToken !== "string") throw new Error("Invalid owner notification lease.");
                await request("/agent/v1/notifications/" + encodeURIComponent(notification.id), {
                  method: "POST",
                  body: JSON.stringify({ status: "delivered", leaseToken: notification.leaseToken })
                }, ownerHeaders, 30000);
                console.log("Archived one owner notification in the private reports repository.");
              } catch (error) {
                console.log("Owner notification archival deferred: " + String(error?.message || error).slice(0,160));
                if (notification?.id && notification?.leaseToken) {
                  try {
                    await request("/agent/v1/notifications/" + encodeURIComponent(notification.id), {
                      method: "POST",
                      body: JSON.stringify({ status: "retry", message: "Private archive delivery deferred.", leaseToken: notification.leaseToken })
                    }, ownerHeaders, 10000);
                  } catch {
                    console.log("Owner notification lease could not be rescheduled; it will expire and recover automatically.");
                  }
                }
                break;
              }
            }
          }

          // Archive the latest sanitized provider failure only to the private reports repository.
          // Never print raw provider diagnostics into this public repository's Actions logs.
          try {
            const archived = await request("/agent/v1/ai-diagnostics/archive", {
              method:"POST", body:JSON.stringify({})
            }, agentHeaders, 20000);
            console.log("Private Workers AI diagnostic archive: " +
              (archived.stored ? archived.path : archived.reason || "not_available"));
          } catch (error) {
            console.log("Private Workers AI diagnostic archive deferred: " +
              String(error?.message || error).slice(0,160));
          }

          const tickTotalMs = Date.now() - tickStartedAt;
          timingSamples.push({name:"tick_total",elapsedMs:tickTotalMs});
          const githubOutput = process.env.GITHUB_OUTPUT;
          if (githubOutput) {
            const fs = await import("node:fs");
            fs.appendFileSync(githubOutput,"timing_samples=" + JSON.stringify(timingSamples.slice(0,30)) + "\n");
          }
          console.log(`[performance] tick_total: ${tickTotalMs}ms; measured_stages=${timingSamples.length}`);
          NODE
      - name: Publish runner completion telemetry
        if: always()
        env:
          MEHRAN_AGENT_TOKEN: ${{ secrets.MEHRAN_AGENT_TOKEN }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TIMING_SAMPLES: ${{ steps.execute_runner.outputs.timing_samples }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.MEHRAN_AGENT_URL;
          const token = process.env.MEHRAN_AGENT_TOKEN || "";
          if (!base || token.length < 40) {
            console.log("Runner telemetry completion skipped: agent identity unavailable.");
            process.exit(0);
          }
          let samples = [];
          try { samples = JSON.parse(process.env.TIMING_SAMPLES || "[]"); } catch {}
          const phase = process.env.JOB_STATUS === "success" ? "finished" : "failed";
          const response = await fetch(base + "/agent/v1/runner/heartbeat", {
            method:"POST",
            headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"},
            body:JSON.stringify({phase,runId:String(process.env.RUN_ID||""),status:String(process.env.JOB_STATUS||"unknown"),timingSamples:Array.isArray(samples)?samples.slice(0,30):[]}),
            signal:AbortSignal.timeout(15000)
          });
          if (!response.ok) {
            console.log("Runner completion telemetry was not accepted; HTTP " + response.status);
            process.exit(0);
          }
          console.log("Runner completion telemetry recorded.");
          NODE


