name: MEHRAN INTELLIGENCE private work-package runner
# Trigger a fresh bounded tick after the verified Worker diagnostics deployment.
# Manual push trigger for post-deploy verification.
# Validation tick: exercise the append-only patch-header canonicalizer on the latest main commit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mehran-intelligence-runner.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each bounded tick so a stale GitHub runner cannot block subsequent ticks.
  group: mehran-intelligence-private-runner-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute-safe-reports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the immutable main history for ancestry checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production semantic analysis against immutable repository evidence
        if: github.event_name == 'push'
        timeout-minutes: 3
        env:
          MEHRAN_ORCHESTRATOR_TOKEN: ${{ secrets.MEHRAN_ORCHESTRATOR_TOKEN }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { isAllowedPatchPath } from "./scripts/intelligence-patch-policy.mjs";
          import { buildIntelligenceInspectionExcerpt } from "./scripts/intelligence-inspection-excerpts.mjs";

          const base = process.env.MEHRAN_AGENT_URL;
          const token = process.env.MEHRAN_ORCHESTRATOR_TOKEN || "";
          const commitSha = String(process.env.GITHUB_SHA || "").toLowerCase();
          if (!base || token.length < 40 || token.length > 200 || !/^[a-f0-9]{40}$/.test(commitSha)) {
            throw new Error("Production semantic verification prerequisites are missing or invalid.");
          }

          const paths = [
            "worker.js",
            "scripts/intelligence-agent.mjs",
            "scripts/intelligence-capabilities.mjs",
            "scripts/intelligence-capabilities.test.mjs",
            "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
          ];
          const files = [];
          let totalChars = 0;
          for (const path of paths) {
            const source = execFileSync("git", ["show", `${commitSha}:${path}`], {
              encoding: "utf8", maxBuffer: 2 * 1024 * 1024
            });
            const excerpt = buildIntelligenceInspectionExcerpt(path, source, 2800);
            if (!excerpt || excerpt.length > 2800) throw new Error("A bounded source excerpt could not be prepared.");
            files.push({
              path,
              sha: execFileSync("git", ["rev-parse", `${commitSha}:${path}`], { encoding: "utf8" }).trim(),
              excerpt
            });
            totalChars += excerpt.length;
          }
          if (files.length !== 5 || totalChars > 16000) {
            throw new Error("Production semantic verification exceeded its source-evidence bounds.");
          }

          const response = await fetch(base + "/agent/v1/repository/analyze", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/json",
              "Content-Type": "application/json",
              "X-Intelligence-Trace-Id": `prod-semantic-${commitSha.slice(0,12)}`
            },
            body: JSON.stringify({ commitSha, files }),
            signal: AbortSignal.timeout(90000)
          });
          const raw = await response.text();
          if (raw.length > 65536) throw new Error("Production semantic response exceeded the safe response limit.");
          let payload;
          try { payload = raw ? JSON.parse(raw) : {}; }
          catch { throw new Error(`Production semantic endpoint returned non-JSON HTTP ${response.status}.`); }
          if (!response.ok || payload.success !== true || payload.commitSha !== commitSha ||
              !payload.analysis || typeof payload.analysis.summary !== "string" ||
              !Array.isArray(payload.analysis.findings) || !Array.isArray(payload.analysis.limitations)) {
            const diagnostic = payload.diagnostic && typeof payload.diagnostic === "object"
              ? {
                  stage: String(payload.diagnostic.stage || "").slice(0,60),
                  code: String(payload.diagnostic.code || "").slice(0,80),
                  field: String(payload.diagnostic.field || "").slice(0,40),
                  findingIndex: Number.isInteger(payload.diagnostic.findingIndex) ? payload.diagnostic.findingIndex : null,
                  evidenceIndex: Number.isInteger(payload.diagnostic.evidenceIndex) ? payload.diagnostic.evidenceIndex : null,
                  httpStatus: response.status
                }
              : { httpStatus: response.status };
            throw new Error("Production semantic verification failed: " + JSON.stringify(diagnostic));
          }
          console.log("[production-semantic-verification] " + JSON.stringify({
            success: true,
            commitSha,
            files: files.length,
            totalChars,
            findings: payload.analysis.findings.length,
            limitations: payload.analysis.limitations.length,
            model: String(payload.model || "unknown").slice(0,100),
            traceId: String(payload.diagnostic?.traceId || "").slice(0,100)
          }));
          NODE
      - name: Bootstrap the first bounded read-only work package and execute approved tasks
        id: execute_runner
        timeout-minutes: 7
        env:
          MEHRAN_AGENT_TOKEN: ${{ secrets.MEHRAN_AGENT_TOKEN }}
          MEHRAN_ORCHESTRATOR_TOKEN: ${{ secrets.MEHRAN_ORCHESTRATOR_TOKEN }}
          MEHRAN_MISSION_GENERATOR_ENABLED: ${{ vars.MEHRAN_MISSION_GENERATOR_ENABLED }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { mkdtempSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { createHash } from "node:crypto";
          import { verifyIntelligenceResultCheckpoint } from "./scripts/intelligence-checkpoint.mjs";
          import { readBoundedResponse } from "./scripts/intelligence-bounded-response.mjs";
          import { buildIntelligenceInspectionExcerpt } from "./scripts/intelligence-inspection-excerpts.mjs";
          const base = process.env.MEHRAN_AGENT_URL;
          const agentToken = process.env.MEHRAN_AGENT_TOKEN || "";
          const orchestratorToken = process.env.MEHRAN_ORCHESTRATOR_TOKEN || "";
          if (!base || agentToken.length < 40 || agentToken.length > 200) {
            throw new Error("MEHRAN_AGENT_TOKEN repository secret is missing or invalid.");
          }
          const agentHeaders = {
            "Authorization": `Bearer ${agentToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const ownerHeaders = {
            "Authorization": `Bearer ${orchestratorToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const tickStartedAt = Date.now();
          const baseSha = String(process.env.GITHUB_SHA || "").toLowerCase();
          if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("Runner main commit SHA is unavailable or invalid.");
          // Keep a safety margin for durable result submission and private report finalization.
          const taskExecutionDeadline = tickStartedAt + 7 * 60 * 1000;
          const timingSamples = [];
          // Track claimed work packages for bounded finalization after task processing.
          const packageIds = new Set();
          let requestSequence = 0;
          const traceRunId = String(process.env.GITHUB_RUN_ID || "local").replace(/[^A-Za-z0-9._:-]/g, "").slice(0, 40);
          function recordTiming(name, startedAt) {
            const elapsedMs = Date.now() - startedAt;
            timingSamples.push({ name, elapsedMs });
            console.log(`[performance] ${name}: ${elapsedMs}ms`);
            return elapsedMs;
          }
          function timingRoute(path) {
            if (path === "/agent/v1/missions/plan") return "mission_plan";
            if (path === "/agent/v1/missions/generate") return "mission_generate";
            if (path === "/agent/v1/repository/analyze") return "repository_analyze";
            if (path === "/agent/v1/tasks/next") return "task_claim";
            if (path.endsWith("/result")) return "task_result";
            if (path.startsWith("/agent/v1/work-packages/")) return "package_finalize";
            if (path === "/health") return "worker_health";
            return "agent_api";
          }
          async function readJsonResponse(response, maxBytes) {
            const raw = await readBoundedResponse(response, maxBytes);
            try {
              const value = raw ? JSON.parse(raw) : {};
              if (!value || typeof value !== "object") throw new Error("invalid JSON value");
              return value;
            } catch {
              throw new Error("Remote API returned invalid or oversized JSON.");
            }
          }
          async function request(path, options = {}, headers = agentHeaders, timeoutMs = 20000) {
            const requestStartedAt = Date.now();
            const traceId = traceRunId + "-" + (++requestSequence);
            let responseStatus = 0;
            try {
              let lastError;
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const response = await fetch(base + path, {
                    ...options,
                    headers: { ...headers, ...(options.headers || {}), "X-Intelligence-Trace-Id": traceId },
                    signal: AbortSignal.timeout(timeoutMs)
                  });
                  responseStatus = response.status;
                  const raw = await readBoundedResponse(response, 65536);
                  let payload;
                  try { payload = raw ? JSON.parse(raw) : {}; }
                  catch { throw new Error(`Agent API returned non-JSON HTTP ${response.status}`); }
                  if (!response.ok) {
                    const failure = new Error(`Agent API HTTP ${response.status}: ${String(payload.error || "request failed").slice(0,180)}`);
                    failure.status = response.status;
                    if (payload.diagnostic && typeof payload.diagnostic === "object" && !Array.isArray(payload.diagnostic)) {
                      const shape = payload.diagnostic.shape;
                      if (payload.diagnostic.stage === "generated_diff_validation" && shape && typeof shape === "object") {
                        failure.safeDiagnostic = {
                          stage: "generated_diff_validation",
                          reason: String(shape.reason || "unknown").slice(0, 80),
                          lineCount: Number.isInteger(shape.lineCount) ? shape.lineCount : null,
                          exactPath: shape.exactPath === true,
                          thirdLineLooksLikeHunk: shape.thirdLineLooksLikeHunk === true,
                          additions: Number.isInteger(shape.additions) ? shape.additions : null,
                          deletions: Number.isInteger(shape.deletions) ? shape.deletions : null,
                          contexts: Number.isInteger(shape.contexts) ? shape.contexts : null,
                          blankPayloadLines: Number.isInteger(shape.blankPayloadLines) ? shape.blankPayloadLines : null,
                          metadataLines: Number.isInteger(shape.metadataLines) ? shape.metadataLines : null,
                          canonicalizerApplied: payload.diagnostic.canonicalizerApplied === true
                        };
                      } else if (payload.diagnostic.stage === "workers_ai_inference") {
                        const diagnostic = payload.diagnostic;
                        failure.safeDiagnostic = {
                          stage: "workers_ai_inference",
                          operation: String(diagnostic.operation || timingRoute(path)).slice(0, 80),
                          traceId: String(diagnostic.traceId || traceId).slice(0, 100),
                          elapsedMs: Number.isFinite(Number(diagnostic.elapsedMs)) ? Number(diagnostic.elapsedMs) : null,
                          name: String(diagnostic.name || "Error").slice(0, 80),
                          code: String(diagnostic.code || "").slice(0, 80),
                          status: Number.isFinite(Number(diagnostic.status)) ? Number(diagnostic.status) : null,
                          causeName: String(diagnostic.causeName || "").slice(0, 80),
                          causeMessage: String(diagnostic.causeMessage || "").slice(0, 180),
                          message: String(diagnostic.message || "").slice(0, 180)
                        };
                      } else if (payload.diagnostic.stage === "analysis_validation") {
                        const diagnostic = payload.diagnostic;
                        const allowedCodes = new Set([
                          "invalid_analysis_structure", "invalid_finding_shape", "invalid_severity",
                          "field_limit_exceeded", "invalid_evidence_array", "invalid_evidence_shape",
                          "unknown_evidence_path", "quote_mismatch", "invalid_regression_tests"
                        ]);
                        const allowedFields = new Set([
                          "analysis", "finding", "severity", "title", "rootCause", "recommendation",
                          "evidence", "path", "quote", "regressionTests", "limitations"
                        ]);
                        failure.safeDiagnostic = {
                          stage: "analysis_validation",
                          operation: "repository_analyze",
                          traceId: String(diagnostic.traceId || traceId).replace(/[^A-Za-z0-9._:-]/g, "").slice(0, 100),
                          elapsedMs: Number.isFinite(diagnostic.elapsedMs) && diagnostic.elapsedMs >= 0
                            ? Math.min(diagnostic.elapsedMs, 600000) : null,
                          code: allowedCodes.has(diagnostic.code) ? diagnostic.code : "unknown_validation_error",
                          findingIndex: Number.isInteger(diagnostic.findingIndex) && diagnostic.findingIndex >= 0 && diagnostic.findingIndex < 8
                            ? diagnostic.findingIndex : null,
                          evidenceIndex: Number.isInteger(diagnostic.evidenceIndex) && diagnostic.evidenceIndex >= 0 && diagnostic.evidenceIndex < 5
                            ? diagnostic.evidenceIndex : null,
                          field: allowedFields.has(diagnostic.field) ? diagnostic.field : null
                        };
                      } else if (payload.diagnostic.stage === "budget_reservation") {
                        failure.safeDiagnostic = {
                          stage: "budget_reservation",
                          operation: String(payload.diagnostic.operation || timingRoute(path)).slice(0, 80),
                          traceId: String(payload.diagnostic.traceId || traceId).slice(0, 100)
                        };
                      }
                    }
                    if (!failure.safeDiagnostic) failure.safeDiagnostic = {
                      stage: "agent_api", operation: timingRoute(path), traceId, httpStatus: response.status
                    };
                    throw failure;
                  }
                  return payload;
                } catch (error) {
                  lastError = error;
                  const transientNetworkFailure = error instanceof TypeError ||
                    /ECONNRESET|ECONNREFUSED|EPIPE|fetch failed|socket hang up/i.test(String(error?.message || error));
                  if (!transientNetworkFailure || attempt === 2) throw error;
                  console.log(`Transient Agent API network failure; retrying attempt ${attempt + 2}/3 for ${path}.`);
                  await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
                }
              }
              throw lastError || new Error("Agent API request failed after retries.");
            } finally {
              const elapsedMs = Date.now() - requestStartedAt;
              console.log(`[trace] ${traceId} ${timingRoute(path)} http=${responseStatus || "network_error"} elapsed_ms=${elapsedMs}`);
              recordTiming(`api:${timingRoute(path)}`, requestStartedAt);
            }
          }

          const runnerRunId = String(process.env.GITHUB_RUN_ID || "local");
          try {
            await request("/agent/v1/runner/heartbeat", {
              method:"POST",
              body:JSON.stringify({phase:"started",runId:runnerRunId,status:"running"})
            }, agentHeaders, 15000);
          } catch (error) {
            // Telemetry must never block mission execution during a rolling Worker deployment.
            console.log("Runner start telemetry temporarily unavailable; continuing work: " + String(error?.message || error).slice(0,160));
          }
          // Scheduled generation remains opt-in. Once enabled, owner-authorized generation may
          // pass attention_required packages, but active queued/running/retrying work still blocks it.
          const missionGenerationRequested =
            (process.env.GITHUB_EVENT_NAME === "schedule" &&
             process.env.MEHRAN_MISSION_GENERATOR_ENABLED === "true") ||
            process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          if (missionGenerationRequested) {
            if (orchestratorToken.length < 40 || orchestratorToken.length > 200) {
              console.log("[mission-generator] Disabled for this tick: owner orchestration token is unavailable.");
            } else {
              const cycleStart = new Date(Math.floor(Date.now() / 900000) * 900000);
              const cycleKey = cycleStart.toISOString().replace(/[^0-9T]/g, "").slice(0, 13);
              try {
                try {
                  const diagnostics = await request("/agent/v1/work-packages/scope-diagnostics", {}, ownerHeaders, 12000);
                  console.log("[mission-generator] preflight diagnostics " + JSON.stringify({
                    packages: diagnostics.packages || null,
                    generatorLock: diagnostics.generatorLock || null
                  }));
                } catch (diagnosticError) {
                  console.log("[mission-generator] preflight diagnostics unavailable: " + String(diagnosticError?.message || diagnosticError).slice(0,160));
                }
                const generated = await request("/agent/v1/missions/generate", {
                  method: "POST",
                  body: JSON.stringify({
                    cycleKey,
                    // Owner explicitly authorized scheduled generation to pass attention_required packages.
                    // The Worker still blocks queued, in-progress, retrying work and competing reservations.
                    ignoreAttentionRequiredBlockers: true
                  })
                }, ownerHeaders, 12000);
                console.log("[mission-generator] " + JSON.stringify({
                  success: generated.success === true,
                  duplicate: generated.duplicate === true,
                  workPackageId: generated.workPackageId || null,
                  status: generated.status || null,
                  cycleKey
                }));
              } catch (error) {
                if (error?.status === 409) {
                  console.log("[mission-generator] Safely paused: active work or another generator reservation exists.");
                } else {
                  console.log("[mission-generator] This tick skipped without affecting queued task execution: " +
                    String(error?.message || error).slice(0, 180));
                }
              }
            }
          }
          // Automatic baseline, AI self-improvement, and fixed-test package seeding is intentionally disabled.
          // The runner processes explicitly queued, approved work packages plus the opt-in read-only generator above.
          function runHost(command, args, timeoutMs = 30000) {
            const result = spawnSync(command, args, { encoding: "utf8", timeout: timeoutMs, maxBuffer: 1024 * 1024 });
            if (result.error) throw new Error(`${command} failed: ${String(result.error.message || result.error).slice(0,160)}`);
            if (result.status !== 0) throw new Error(`${command} exited ${result.status}: ${String(result.stderr || result.stdout || "").slice(0,180)}`);
            return String(result.stdout || "").trim();
          }

          function runFixedRepositoryTests(task) {
            let payload = {};
            try {
              payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
            } catch {
              throw new Error("Test task payload is not valid JSON.");
            }
            const baseSha = String(payload.baseSha || "").toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("Test task requires one exact 40-character base SHA.");
            const currentSha = String(process.env.GITHUB_SHA || runHost("git", ["rev-parse", "HEAD"])).toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(currentSha)) throw new Error("Runner checkout SHA is invalid.");
            runHost("git", ["merge-base", "--is-ancestor", baseSha, currentSha]);
            const tempRoot = mkdtempSync(join(tmpdir(), "mehran-intelligence-tests-"));
            const workspace = join(tempRoot, "repo");
            try {
              runHost("git", ["worktree", "add", "--detach", workspace, baseSha]);
              const image = "node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a";
              const args = [
                "run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                "--security-opt", "no-new-privileges", "--pids-limit", "64", "--memory", "768m",
                "--cpus", "1", "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=64m",
                "--mount", `type=bind,src=${workspace},dst=/workspace,readonly`,
                "--workdir", "/workspace", image, "sh", "-c",
                "node --check worker.js && node --check scripts/intelligence-capabilities.mjs && node --check scripts/intelligence-patch-policy.mjs && node --check scripts/intelligence-inbox-schema.mjs && node --test --test-reporter=tap scripts/intelligence-capabilities.test.mjs scripts/intelligence-inbox-schema.test.mjs"
              ];
              const result = spawnSync("docker", args, { encoding: "utf8", timeout: 240000, maxBuffer: 1024 * 1024 });
              const output = [result.stdout || "", result.stderr || ""].join("\n").slice(-24000);
              const total = Number(output.match(/^# tests (\d+)$/m)?.[1] || 0);
              const passed = Number(output.match(/^# pass (\d+)$/m)?.[1] || 0);
              const failed = Number(output.match(/^# fail (\d+)$/m)?.[1] || 0);
              const exitCode = Number.isInteger(result.status) ? result.status : 1;
              return {
                type: "run_repository_tests",
                generatedAt: new Date().toISOString(),
                mode: "isolated_fixed_repository_test",
                repository: "Mehranmsh/mehranmsh.github.io",
                baseSha,
                workflowRunId: String(process.env.GITHUB_RUN_ID || ""),
                workflowAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0),
                testSuite: "scripts/intelligence-capabilities.test.mjs + scripts/intelligence-inbox-schema.test.mjs",
                tests: { total, passed, failed },
                exitCode,
                outputSha256: createHash("sha256").update(output).digest("hex"),
                container: {
                  network: "none", readOnly: true, capDropAll: true, noNewPrivileges: true,
                  memoryMb: 768, cpus: 1, pidsLimit: 64
                },
                passed: exitCode === 0 && total > 0 && passed === total && failed === 0
              };
            } finally {
              try { runHost("git", ["worktree", "remove", "--force", workspace]); } catch {}
              rmSync(tempRoot, { recursive: true, force: true });
            }
          }

          async function execute(task) {
            if (!task || task.status !== "in_progress" || task.requiresApproval !== false || !["mehran_intelligence", "shared"].includes(task.assignedTo)) {
              throw new Error("Claimed task failed assignment, approval, or status validation.");
            }
            if (task.actionType === "run_repository_tests") {
              return runFixedRepositoryTests(task);
            }
            if (task.actionType === "propose_code_patch") {
              let payload = {};
              let checkpoint = {};
              try {
                payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
                checkpoint = typeof task.checkpoint === "string" ? JSON.parse(task.checkpoint || "{}") : (task.checkpoint || {});
              } catch {
                throw new Error("Patch proposal task payload or checkpoint is not valid JSON.");
              }
              const objective = typeof payload.objective === "string" ? payload.objective.trim() : "";
              const targetPath = typeof payload.targetPath === "string" ? payload.targetPath : "";
              if (objective.length < 12 || objective.length > 800 || !isAllowedPatchPath(targetPath)) {
                throw new Error("Patch proposal task requires one bounded objective.");
              }
              let baseSha = String(checkpoint.baseSha || "").toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(baseSha)) {
                const headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                  "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
                };
                const response = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io/commits/main", {
                  headers, signal: AbortSignal.timeout(15000)
                });
                if (!response.ok) throw new Error(`GitHub main commit lookup HTTP ${response.status}`);
                const commit = await readJsonResponse(response, 65536);
                baseSha = String(commit?.sha || "").toLowerCase();
                if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("GitHub returned an invalid main commit SHA.");
                const saved = await request(`/agent/v1/tasks/${encodeURIComponent(task.id)}/checkpoint`, {
                  method: "POST",
                  body: JSON.stringify({ checkpoint: { baseSha }, claimToken: task.claimToken })
                });
                if (!saved.checkpointSaved) throw new Error("Immutable patch base commit could not be checkpointed.");
              }
              const proposal = await request("/agent/v1/patch-proposals/generate", {
                method: "POST",
                body: JSON.stringify({ baseSha, objective, targetPath, requestId: task.id })
              }, agentHeaders, 90000);
              if (proposal.requestId !== task.id || proposal.status !== "stored" || proposal.targetPath !== targetPath || proposal.validationMode !== "bounded_single_file_validate_only" ||
                  !/^[A-Za-z0-9_-]{43}$/.test(proposal.requestHash || "") ||
                  !/^[a-f0-9-]{36}$/.test(proposal.proposalId || "") ||
                  !/^[a-f0-9]{64}$/.test(proposal.artifactSha256 || "") ||
                  !/^[a-f0-9]{64}$/.test(proposal.diffSha256 || "")) {
                throw new Error("Patch generation API returned incomplete or unverified proposal metadata.");
              }
              return {
                type: task.actionType,
                applied: false,
                generatedAt: new Date().toISOString(),
                requestId: proposal.requestId,
                requestHash: proposal.requestHash,
                proposalId: proposal.proposalId,
                path: proposal.path,
                artifactSha256: proposal.artifactSha256,
                diffSha256: proposal.diffSha256,
                status: proposal.status,
                baseSha,
                targetPath: proposal.targetPath,
                validationMode: proposal.validationMode,
                summary: proposal.summary
              };
            }
            if (task.actionType === "service_health_report") {
              const health = await request("/health", {}, { "Accept": "application/json" });
              if (health.status !== "online" || health.database !== true) {
                throw new Error("Worker or D1 health check did not pass.");
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                worker: health.status,
                database: health.database,
                scheduler: health.scheduler || null,
                scope: "Read-only Worker health endpoint."
              };
            }
            if (task.actionType === "repository_quality_check") {
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
              };
              const repoResponse = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io", {
                headers, signal: AbortSignal.timeout(12000)
              });
              if (!repoResponse.ok) throw new Error(`GitHub repository metadata HTTP ${repoResponse.status}`);
              const metadata = await readJsonResponse(repoResponse, 65536);
