name: MEHRAN INTELLIGENCE private work-package runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mehran-intelligence-runner.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mehran-intelligence-private-runner
  cancel-in-progress: false

jobs:
  execute-safe-reports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap the first bounded read-only work package and execute approved tasks
        env:
          MEHRAN_AGENT_TOKEN: ${{ secrets.MEHRAN_AGENT_TOKEN }}
          MEHRAN_ORCHESTRATOR_TOKEN: ${{ secrets.MEHRAN_ORCHESTRATOR_TOKEN }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.MEHRAN_AGENT_URL;
          const agentToken = process.env.MEHRAN_AGENT_TOKEN || "";
          const orchestratorToken = process.env.MEHRAN_ORCHESTRATOR_TOKEN || "";
          if (!base || agentToken.length < 40 || agentToken.length > 200) {
            throw new Error("MEHRAN_AGENT_TOKEN repository secret is missing or invalid.");
          }
          const agentHeaders = {
            "Authorization": `Bearer ${agentToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const ownerHeaders = {
            "Authorization": `Bearer ${orchestratorToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const tickStartedAt = Date.now();
          const timingSamples = [];
          function recordTiming(name, startedAt) {
            const elapsedMs = Date.now() - startedAt;
            timingSamples.push({ name, elapsedMs });
            console.log(`[performance] ${name}: ${elapsedMs}ms`);
            return elapsedMs;
          }
          function timingRoute(path) {
            if (path === "/agent/v1/missions/plan") return "mission_plan";
            if (path === "/agent/v1/tasks/next") return "task_claim";
            if (path.endsWith("/result")) return "task_result";
            if (path.startsWith("/agent/v1/work-packages/")) return "package_finalize";
            if (path === "/health") return "worker_health";
            return "agent_api";
          }
          async function request(path, options = {}, headers = agentHeaders, timeoutMs = 20000) {
            const requestStartedAt = Date.now();
            try {
            const response = await fetch(base + path, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
              signal: AbortSignal.timeout(timeoutMs)
            });
            const raw = await response.text();
            let payload;
            try { payload = raw ? JSON.parse(raw) : {}; }
            catch { throw new Error(`Agent API returned non-JSON HTTP ${response.status}`); }
            if (!response.ok) throw new Error(`Agent API HTTP ${response.status}: ${String(payload.error || "request failed").slice(0,180)}`);
            return payload;
            } finally {
              recordTiming(`api:${timingRoute(path)}`, requestStartedAt);
            }
          }

          // AI planning is optional for this runner tick. A planner failure must never
          // prevent deterministic checks or already-queued approved tasks from executing.
          let packageId = "";
          const packageIds = new Set();
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            try {
              const created = await request("/agent/v1/missions/plan", {
                method: "POST",
                body: JSON.stringify({
                  idempotencyKey: `mehran-intelligence-owner-mission-v1-${new Date().toISOString().slice(0,10)}`,
                  mission: "Assess the current MEHRAN INTELLIGENCE system and determine the next safest steps toward independently receiving, planning, executing, verifying, and reporting owner-assigned missions. Use only the currently available read-only capabilities. Identify what is already proven, what remains unproven, and the smallest next engineering milestone. Do not claim capabilities that have not been verified."
                })
              }, ownerHeaders, 90000);
              packageId = created.workPackageId || "";
              if (packageId) packageIds.add(packageId);
              console.log(`Mission package: ${created.status || "unknown"}; duplicate=${Boolean(created.duplicate)}; tasks=${created.taskCount || 0}`);
              if (created.planSummary) console.log(`Plan summary: ${String(created.planSummary).slice(0, 500)}`);
            } catch (error) {
              const diagnostic = String(error?.message || error).slice(0, 300);
              console.log(`AI mission planning unavailable for this tick; continuing with eligible queued tasks: ${diagnostic}`);
            }
          } else {
            console.log("AI mission planning skipped: owner token is unavailable. Existing eligible tasks may still run.");
          }

          async function execute(task) {
            if (!task || task.status !== "in_progress" || task.requiresApproval !== false || !["mehran_intelligence", "shared"].includes(task.assignedTo)) {
              throw new Error("Claimed task failed assignment, approval, or status validation.");
            }
            if (task.actionType === "service_health_report") {
              const health = await request("/health", {}, { "Accept": "application/json" });
              if (health.status !== "online" || health.database !== true) {
                throw new Error("Worker or D1 health check did not pass.");
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                worker: health.status,
                database: health.database,
                scheduler: health.scheduler || null,
                scope: "Read-only Worker health endpoint."
              };
            }
            if (task.actionType === "repository_quality_check") {
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
              };
              const repoResponse = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io", {
                headers, signal: AbortSignal.timeout(12000)
              });
              if (!repoResponse.ok) throw new Error(`GitHub repository metadata HTTP ${repoResponse.status}`);
              const metadata = await repoResponse.json();
              if (metadata.full_name !== "Mehranmsh/mehranmsh.github.io") throw new Error("Unexpected repository identity.");
              const commitResponse = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io/commits?per_page=1", {
                headers, signal: AbortSignal.timeout(12000)
              });
              if (!commitResponse.ok) throw new Error(`GitHub latest commit HTTP ${commitResponse.status}`);
              const commits = await commitResponse.json();
              const latest = Array.isArray(commits) ? commits[0] : null;
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                repository: metadata.full_name,
                defaultBranch: metadata.default_branch || null,
                openIssues: Number(metadata.open_issues_count || 0),
                lastPushedAt: metadata.pushed_at || null,
                latestCommit: latest?.sha ? latest.sha.slice(0, 12) : null,
                latestCommitAt: latest?.commit?.committer?.date || latest?.commit?.author?.date || null,
                scope: "Public GitHub metadata only. No source execution or repository writes."
              };
            }
            if (task.actionType === "inspect_repository") {
              const repository = "Mehranmsh/mehranmsh.github.io";
              const allowedPaths = new Set([
                "worker.js",
                "scripts/intelligence-agent.mjs",
                "scripts/intelligence-capabilities.mjs",
                "scripts/intelligence-capabilities.test.mjs",
                ".github/workflows/mehran-intelligence-runner.yml",
                "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
              ]);
              let payload = {};
              try {
                payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
              } catch {
                throw new Error("Inspection task payload is not valid JSON.");
              }
              const paths = payload.paths;
              if (!Array.isArray(paths) || paths.length < 1 || paths.length > 6 ||
                  new Set(paths).size !== paths.length || paths.some(path => typeof path !== "string" || !allowedPaths.has(path))) {
                throw new Error("Inspection paths are outside the exact read-only allowlist.");
              }
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
              };
              if ((process.env.GITHUB_TOKEN || "").length < 20) throw new Error("GitHub read token is unavailable.");
              const commitResponse = await fetch(`https://api.github.com/repos/${repository}/commits/main`, {
                headers, signal: AbortSignal.timeout(15000)
              });
              if (!commitResponse.ok) throw new Error(`GitHub main commit lookup HTTP ${commitResponse.status}`);
              const commit = await commitResponse.json();
              if (typeof commit.sha !== "string" || !/^[a-f0-9]{40}$/i.test(commit.sha)) throw new Error("GitHub returned an invalid main commit SHA.");
              const files = [];
              let totalBytes = 0;
              for (const path of paths) {
                const apiPath = path.split("/").map(encodeURIComponent).join("/");
                const response = await fetch(`https://api.github.com/repos/${repository}/contents/${apiPath}?ref=${commit.sha}`, {
                  headers, signal: AbortSignal.timeout(15000)
                });
                if (!response.ok) throw new Error(`GitHub source read failed for allowlisted path ${path}: HTTP ${response.status}`);
                const file = await response.json();
                if (file.type !== "file" || file.path !== path || file.encoding !== "base64" ||
                    typeof file.content !== "string" || typeof file.sha !== "string" || !/^[a-f0-9]{40}$/i.test(file.sha) ||
                    !Number.isInteger(file.size) || file.size < 0 || file.size > 500000) {
                  throw new Error(`GitHub returned an invalid or oversized source file for ${path}.`);
                }
                const source = Buffer.from(file.content.replace(/\n/g, ""), "base64").toString("utf8");
                const bytes = Buffer.byteLength(source, "utf8");
                if (bytes !== file.size) throw new Error(`GitHub source size verification failed for ${path}.`);
                totalBytes += bytes;
                if (totalBytes > 750000) throw new Error("Inspection exceeded the 250 KB aggregate source limit.");
                const symbols = new Set();
                const patterns = [
                  /^\s*(?:export\s+)?(?:async\s+)?(?:function|class)\s+([A-Za-z_$][\w$]*)/gm,
                  /^\s*(?:export\s+)?(?:const|let|var)\s+([A-Za-z_$][\w$]*)/gm
                ];
                for (const pattern of patterns) {
                  let match;
                  while ((match = pattern.exec(source)) && symbols.size < 4) symbols.add(match[1]);
                }
                files.push({
                  path,
                  blobSha: file.sha,
                  bytes,
                  lineCount: source.length ? source.split(/\r\n|\n|\r/).length : 0,
                  symbols: [...symbols]
                });
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                mode: "bounded_read_only_repository_inspection",
                repository,
                commitSha: commit.sha,
                summary: { filesInspected: files.length, totalBytes },
                files,
                limitations: [
                  "Read-only source inventory and declaration extraction; not a semantic code review.",
                  "Repository content was treated as untrusted data and was never executed or followed as instructions.",
                  "Only exact allowlisted files at one immutable main commit were read."
                ]
              };
            }
            if (task.actionType === "source_security_audit") {
              const repo = "Mehranmsh/mehranmsh.github.io";
              async function readSource(path) {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=main`, {
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                    "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
                  },
                  signal: AbortSignal.timeout(20000)
                });
                if (!response.ok) throw new Error(`GitHub source read failed for ${path}: HTTP ${response.status}`);
                const file = await response.json();
                if (file.type !== "file" || typeof file.content !== "string" || file.encoding !== "base64") throw new Error(`Unexpected GitHub content response for ${path}`);
                return { text: Buffer.from(file.content.replace(/\n/g, ""), "base64").toString("utf8"), sha: file.sha, size: Number(file.size || 0) };
              }
              const [workerSource, runnerSource, protocolSource] = await Promise.all([
                readSource("worker.js"),
                readSource(".github/workflows/mehran-intelligence-runner.yml"),
                readSource("docs/INTELLIGENCE_EXECUTION_PROTOCOL.md")
              ]);
              const plannerStart = workerSource.text.indexOf("async function planIntelligenceMission");
              const plannerEnd = workerSource.text.indexOf("export function verifyIntelligenceReport", plannerStart);
              const validationStart = workerSource.text.indexOf("export function validateIntelligenceWorkPackage");
              const validationEnd = workerSource.text.indexOf("async function createIntelligenceWorkPackage", validationStart);
              const agentStart = workerSource.text.indexOf('if (path.startsWith("/agent/v1/"))');
              const agentEnd = workerSource.text.indexOf('if (path === "/health"', agentStart);
              const mcpStart = workerSource.text.indexOf('if (path === "/mcp" && method === "POST")');
              const mcpEnd = workerSource.text.indexOf('if (path === "/intelligence/chat" && method === "POST")', mcpStart);
              const plannerSource = plannerStart >= 0 && plannerEnd > plannerStart ? workerSource.text.slice(plannerStart, plannerEnd) : "";
              const validationSource = validationStart >= 0 && validationEnd > validationStart ? workerSource.text.slice(validationStart, validationEnd) : "";
              const agentSource = agentStart >= 0 && agentEnd > agentStart ? workerSource.text.slice(agentStart, agentEnd) : "";
              const mcpSource = mcpStart >= 0 && mcpEnd > mcpStart ? workerSource.text.slice(mcpStart, mcpEnd) : "";
              const capabilityActions = ["service_health_report", "repository_quality_check", "source_security_audit"];
              const capabilitySections = [plannerSource, validationSource, agentSource, mcpSource, runnerSource.text];
              const capabilityAllowlistAligned = capabilitySections.every(section =>
                section.length > 0 && capabilityActions.every(action => section.includes(action))
              );
              const ownerMissionStart = workerSource.text.indexOf('if (path === "/intelligence/missions" && method === "POST")');
              const ownerMissionEnd = workerSource.text.indexOf('if (path === "/intelligence/tasks"', ownerMissionStart);
              const ownerMissionRoute = ownerMissionStart >= 0 && ownerMissionEnd > ownerMissionStart
                ? workerSource.text.slice(ownerMissionStart, ownerMissionEnd) : "";
              const forbiddenRunnerPatterns = [new RegExp("wrangler\\s+deploy"), new RegExp("git\\s+push"), new RegExp(["CLOUDFLARE", "_API_TOKEN"].join("")), new RegExp(["createOrUpdate", "FileContents"].join(""))];
              const checks = [
                { id: "cors_origin_guard", passed: /origin\s*&&\s*origin\s*!==\s*ALLOWED_ORIGIN/.test(workerSource.text), detail: "Unexpected browser origins are rejected." },
                { id: "separate_agent_and_owner_tokens", passed: workerSource.text.includes("MEHRAN_AGENT_TOKEN") && workerSource.text.includes("MEHRAN_ORCHESTRATOR_TOKEN"), detail: "Agent and owner identities are separately referenced." },
                { id: "constant_time_token_hash_comparison", passed: /let mismatch = expectedHash\.length \^ suppliedHash\.length;[\s\S]{0,500}mismatch \|= \(expectedHash\.charCodeAt\(i\) \|\| 0\) \^ \(suppliedHash\.charCodeAt\(i\) \|\| 0\);[\s\S]{0,180}if \(mismatch !== 0\)/.test(workerSource.text), detail: "Hashed-token comparison path is present." },
                { id: "rate_limit_controls", passed: /checkRateLimit\(/.test(workerSource.text), detail: "Rate-limit enforcement calls are present." },
                {
                  id: "pbkdf2_worker_compatible_configuration",
                  passed: (() => {
                    const configured = workerSource.text.match(/const\s+PBKDF2_ITERATIONS\s*=\s*(\d+)\s*;/);
                    return Number(configured?.[1]) === 100000
                      && /async function hashPassword\(password, iterations = PBKDF2_ITERATIONS\)/.test(workerSource.text)
                      && /if \(iterations !== PBKDF2_ITERATIONS\)/.test(workerSource.text);
                  })(),
                  detail: "Password hashing and verification consistently use the Worker-compatible PBKDF2 setting of 100,000 iterations; unsupported higher counts are not enabled."
                },
                { id: "fixed_private_report_repository", passed: workerSource.text.includes("repos/Mehranmsh/mehran-intelligence-reports/contents/"), detail: "Report persistence targets the designated private repository." },
                { id: "audit_action_is_allowlisted", passed: workerSource.text.includes('"source_security_audit"'), detail: "Bounded source-audit action is recognized." },
                { id: "runner_read_only_contents_permission", passed: /permissions:\s*\n\s*contents:\s*read/.test(runnerSource.text), detail: "Runner workflow declares contents: read." },
                { id: "runner_does_not_checkout_or_execute_repo_scripts", passed: !/actions\/checkout@|npm\s+(?:run|install)|pnpm\s+(?:run|install)|yarn\s+(?:run|install)/.test(runnerSource.text), detail: "Runner does not check out the target repo or invoke its package scripts." },
                { id: "planner_validator_agent_mcp_and_runner_allowlists_aligned", passed: capabilityAllowlistAligned, detail: "The same three read-only action types appear in the planner schema, work-package validator, authenticated agent claim route, MCP package schema, and scheduled executor." },
                { id: "custom_owner_missions_remain_admin_gated_without_fallback", passed: /verifyAdmin\(request, env\)/.test(ownerMissionRoute) && /allowDeterministicFallback: false/.test(ownerMissionRoute) && /writeAdminAudit\(/.test(ownerMissionRoute), detail: "Custom mission intake remains administrator-authenticated, audited, and fails closed when AI planning is unavailable." },
                { id: "mcp_package_intake_keeps_separate_bridge_and_owner_identities", passed: mcpSource.includes("MEHRAN_MCP_TOKEN") && mcpSource.includes("MEHRAN_ORCHESTRATOR_TOKEN") && mcpSource.includes("packageIntakeEnabled = bridgeAuthorized && orchestratorSecret.length >= 40"), detail: "Private package tools require the dedicated bridge identity and the separately configured owner opt-in." },
                { id: "executor_rechecks_assignment_status_and_approval", passed: /task\.status !== "in_progress"/.test(runnerSource.text) && /task\.requiresApproval !== false/.test(runnerSource.text) && /\["mehran_intelligence", "shared"\]\.includes\(task\.assignedTo\)/.test(runnerSource.text), detail: "The executor independently rejects tasks that are not active, assigned to an allowed identity, and explicitly pre-approved." },
                { id: "runner_has_no_deploy_or_repository_write_commands", passed: forbiddenRunnerPatterns.every(pattern => !pattern.test(runnerSource.text)), detail: "The scheduled runner has no configured deployment or repository-write command path." },
                { id: "execution_protocol_still_marks_end_to_end_acceptance_as_required", passed: protocolSource.text.includes("Do not describe the protocol as active until the acceptance criteria have passed in an end-to-end test."), detail: "The protocol's end-to-end acceptance boundary remains explicit in the source documentation." }
              ];
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                mode: "deterministic_read_only_static_audit",
                files: {
                  "worker.js": { sha: workerSource.sha, bytes: workerSource.size },
                  ".github/workflows/mehran-intelligence-runner.yml": { sha: runnerSource.sha, bytes: runnerSource.size },
                  "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md": { sha: protocolSource.sha, bytes: protocolSource.size }
                },
                summary: { checks: checks.length, passed: checks.filter(x => x.passed).length, failed: checks.filter(x => !x.passed).length, status: checks.every(x => x.passed) ? "passed" : "attention_required" },
                checks,
                limitations: [
                  "Deterministic pattern-based capability and security audit, not an AI code review.",
                  "Reads only worker.js, the Intelligence runner workflow, and the execution protocol from main.",
                  "Allowlist alignment proves source-level consistency only; it does not prove that the current ChatGPT session has a live private MCP connection or that the complete end-to-end protocol has passed.",
                  "Does not execute repository code, modify files, access secrets, or deploy.",
                  "PBKDF2 is held at the Worker-compatible 100,000-iteration setting; stronger iteration counts require a runtime-supported KDF path and must not be enabled by assumption."
                ]
              };
            }
            throw new Error("Runner refused an action outside its read-only allowlist.");
          }

          function serializeBoundedResult(value, maxChars = 3000) {
            if (!Number.isInteger(maxChars) || maxChars < 256) {
              throw new Error("Invalid bounded-result character limit.");
            }
            const full = JSON.stringify(value);
            if (typeof full !== "string") throw new Error("Task result is not JSON serializable.");
            if (full.length <= maxChars) return full;

            // Keep the exact schema required by verifyIntelligenceReport while
            // shortening verbose evidence. In particular, every check retains
            // its id, boolean outcome, and string detail.
            const compact = {
              type: value?.type || "read_only_report",
              generatedAt: value?.generatedAt || new Date().toISOString(),
              mode: value?.mode || "bounded_read_only_result",
              summary: value?.summary || null,
              repository: value?.repository || undefined,
              commitSha: value?.commitSha || undefined,
              files: Array.isArray(value?.files)
                ? value.files.map(file => ({
                    path: String(file?.path || "").slice(0, 240),
                    blobSha: String(file?.blobSha || "").slice(0, 40),
                    bytes: Number(file?.bytes || 0),
                    lineCount: Number(file?.lineCount || 0),
                    symbols: Array.isArray(file?.symbols) ? file.symbols.slice(0, 4).map(item => String(item).slice(0, 100)) : []
                  }))
                : value?.files && typeof value.files === "object"
                  ? Object.fromEntries(Object.entries(value.files).map(([name, file]) => [
                      name, { sha: file?.sha || null, bytes: Number(file?.bytes || 0) }
                    ]))
                  : undefined,
              checks: Array.isArray(value?.checks)
                ? value.checks.map(check => ({
                    id: String(check?.id || "unnamed_check").slice(0, 80),
                    passed: check?.passed === true,
                    detail: String(check?.detail || "").slice(0, 64)
                  }))
                : undefined,
              limitations: Array.isArray(value?.limitations)
                ? value.limitations.map(item => String(item).slice(0, 72))
                : undefined,
              detailsTruncated: true
            };
            let bounded = JSON.stringify(compact);
            if (bounded.length > maxChars) {
              // The Worker verifier requires mode, both source-file entries,
              // summary, and a detail string for every check. Do not drop them.
              const minimal = {
                type: compact.type,
                generatedAt: compact.generatedAt,
                mode: compact.mode,
                repository: compact.repository,
                commitSha: compact.commitSha,
                files: compact.files,
                summary: compact.summary,
                checks: Array.isArray(compact.checks)
                  ? compact.checks.map(check => ({
                      id: check.id,
                      passed: check.passed,
                      detail: ""
                    }))
                  : undefined,
                detailsTruncated: true
              };
              bounded = JSON.stringify(minimal);
            }
            if (bounded.length > maxChars) {
              throw new Error("Task result exceeds the Worker API limit after schema-preserving compaction.");
            }
            return bounded;
          }
          for (let count = 0; count < 5; count++) {
            const claim = await request("/agent/v1/tasks/next");
            const task = claim.task;
            if (task?.workPackageId) packageIds.add(task.workPackageId);
            if (!task) {
              if (count === 0) console.log("No eligible approved tasks.");
              break;
            }
            let status = "completed";
            let result;
            const executionStartedAt = Date.now();
            try {
              result = serializeBoundedResult(await execute(task));
            } catch (error) {
              status = "blocked";
              const diagnostic = String(error?.message || error).slice(0,300);
              console.log(`Read-only task diagnostic (${task.actionType}): ${diagnostic}`);
              result = `Read-only runner failed: ${diagnostic}`;
            }
            recordTiming(`task_execute:${task.actionType}`, executionStartedAt);
            await request(`/agent/v1/tasks/${encodeURIComponent(task.id)}/result`, {
              method: "POST",
              body: JSON.stringify({ status, result })
            });
            console.log(`One read-only task finished with status: ${status}`);
          }

          // Finalize every package touched by this tick, including missions submitted from the owner UI.
          if (packageIds.size && orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            for (const workPackageId of packageIds) {
              const finalState = await request(`/agent/v1/work-packages/${encodeURIComponent(workPackageId)}`, {}, ownerHeaders);
              console.log("Work package " + workPackageId + " final status: " + (finalState.workPackage?.status || "unknown"));
              console.log("Private report storage: " + (finalState.reportStorage?.stored ? "stored" : "not stored") + "; path=" + (finalState.reportStorage?.path || "none") + "; reason=" + (finalState.reportStorage?.reason || "none"));
            }
          }
          console.log(`[performance] tick_total: ${Date.now() - tickStartedAt}ms; measured_stages=${timingSamples.length}`);
          NODE
