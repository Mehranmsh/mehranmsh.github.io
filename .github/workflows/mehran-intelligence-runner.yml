name: MEHRAN INTELLIGENCE private work-package runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mehran-intelligence-runner.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mehran-intelligence-private-runner
  cancel-in-progress: false

jobs:
  execute-safe-reports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the immutable main history for ancestry checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap the first bounded read-only work package and execute approved tasks
        env:
          MEHRAN_AGENT_TOKEN: ${{ secrets.MEHRAN_AGENT_TOKEN }}
          MEHRAN_ORCHESTRATOR_TOKEN: ${{ secrets.MEHRAN_ORCHESTRATOR_TOKEN }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { mkdtempSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { createHash } from "node:crypto";
          const base = process.env.MEHRAN_AGENT_URL;
          const agentToken = process.env.MEHRAN_AGENT_TOKEN || "";
          const orchestratorToken = process.env.MEHRAN_ORCHESTRATOR_TOKEN || "";
          if (!base || agentToken.length < 40 || agentToken.length > 200) {
            throw new Error("MEHRAN_AGENT_TOKEN repository secret is missing or invalid.");
          }
          const agentHeaders = {
            "Authorization": `Bearer ${agentToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const ownerHeaders = {
            "Authorization": `Bearer ${orchestratorToken}`,
            "Accept": "application/json",
            "Content-Type": "application/json"
          };
          const tickStartedAt = Date.now();
          const timingSamples = [];
          function recordTiming(name, startedAt) {
            const elapsedMs = Date.now() - startedAt;
            timingSamples.push({ name, elapsedMs });
            console.log(`[performance] ${name}: ${elapsedMs}ms`);
            return elapsedMs;
          }
          function timingRoute(path) {
            if (path === "/agent/v1/missions/plan") return "mission_plan";
            if (path === "/agent/v1/tasks/next") return "task_claim";
            if (path.endsWith("/result")) return "task_result";
            if (path.startsWith("/agent/v1/work-packages/")) return "package_finalize";
            if (path === "/health") return "worker_health";
            return "agent_api";
          }
          async function request(path, options = {}, headers = agentHeaders, timeoutMs = 20000) {
            const requestStartedAt = Date.now();
            try {
            const response = await fetch(base + path, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
              signal: AbortSignal.timeout(timeoutMs)
            });
            const raw = await response.text();
            let payload;
            try { payload = raw ? JSON.parse(raw) : {}; }
            catch { throw new Error(`Agent API returned non-JSON HTTP ${response.status}`); }
            if (!response.ok) {
              const failure = new Error(`Agent API HTTP ${response.status}: ${String(payload.error || "request failed").slice(0,180)}`);
              failure.status = response.status;
              throw failure;
            }
            return payload;
            } finally {
              recordTiming(`api:${timingRoute(path)}`, requestStartedAt);
            }
          }

          // Seed one bounded read-only baseline inspection. Its stable daily key avoids duplicate packages
          // while ensuring the AI planner has real, immutable repository evidence to analyze.
          const packageIds = new Set();
          let selfImprovementPackageId = "";
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            try {
              const created = await request("/agent/v1/work-packages", {
                method: "POST",
                body: JSON.stringify({
                  idempotencyKey: `mehran-intelligence-repo-inspection-v1-${new Date().toISOString().slice(0,10)}`,
                  title: "MEHRAN INTELLIGENCE first bounded repository inspection",
                  objective: "Inspect the bounded core execution architecture and preserve verified evidence for the first self-improvement assessment.",
                  priority: "normal",
                  scope: {
                    mode: "read_only",
                    mission: "Inspect six explicitly allowlisted core files at one immutable main commit.",
                    allowedActions: ["inspect_repository"],
                    forbidden: ["source_changes", "deployment", "secret_access", "wallet_operations", "arbitrary_shell"]
                  },
                  tasks: [{
                    taskId: "inspect-core",
                    title: "Inspect MEHRAN INTELLIGENCE core files",
                    description: "Read exact allowlisted source files from one immutable main commit and return bounded file metadata and declaration inventory for private review.",
                    actionType: "inspect_repository",
                    dependsOn: [],
                    paths: [
                      "worker.js",
                      "scripts/intelligence-agent.mjs",
                      "scripts/intelligence-capabilities.mjs",
                      "scripts/intelligence-capabilities.test.mjs",
                      ".github/workflows/mehran-intelligence-runner.yml",
                      "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
                    ]
                  }]
                })
              }, ownerHeaders, 30000);
              if (created.workPackageId) packageIds.add(created.workPackageId);
              console.log(`Baseline inspection package: ${created.status || "unknown"}; duplicate=${Boolean(created.duplicate)}; tasks=${created.taskCount || 0}`);
            } catch (error) {
              console.log("Baseline inspection seeding failed closed: " + String(error?.message || error).slice(0,240));
            }
          }

          // Give MEHRAN INTELLIGENCE its first owner-defined self-improvement mission.
          // The Workers AI planner may decompose it only into server-allowlisted actions.
          // If AI planning is unavailable, fail visibly instead of disguising a fallback as AI work.
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            try {
              const planned = await request("/agent/v1/missions/plan", {
                method: "POST",
                body: JSON.stringify({
                  idempotencyKey: "mehran-intelligence-self-improvement-baseline-v1",
                  mission: "MEHRAN INTELLIGENCE: perform the first evidence-based self-assessment. Inspect the bounded core execution architecture, verify the existing fixed capability test suite and deterministic security controls, identify the most important gaps between the current executor and a professional autonomous company assistant, and produce a prioritized, staged self-improvement plan. Prefer practical capabilities for mission understanding, research, multi-step execution, durable learning from completed work, and safe self-improvement. Do not claim capabilities that do not exist. Any code change must remain a private proposal for owner review; never modify source, create branches or pull requests, merge, deploy, access secrets, or perform wallet/financial actions.",
                  allowDeterministicFallback: false
                })
              }, ownerHeaders, 45000);
              const plannedId = planned.workPackageId || "";
              if (plannedId) selfImprovementPackageId = plannedId;
              if (plannedId) packageIds.add(plannedId);
              console.log(`Self-improvement mission: ${planned.status || "unknown"}; duplicate=${Boolean(planned.duplicate)}; tasks=${planned.taskCount || 0}; planner=${planned.planner?.provider || "unavailable"}`);
              if (planned.plannerUnavailable) {
                console.log("Self-improvement mission was not created because AI planning is unavailable; no deterministic result is presented as AI analysis.");
              }
            } catch (error) {
              const diagnostic = String(error?.message || error).slice(0, 300);
              console.log(`Self-improvement mission planning unavailable for this tick; continuing with eligible queued tasks: ${diagnostic}`);
            }
          } else {
            console.log("Self-improvement mission skipped: owner orchestration identity is unavailable. Existing eligible tasks may still run.");
          }

          // Queue one immutable fixed-suite test mission per main commit. The idempotency key
          // prevents repeated five-minute runner ticks from duplicating the same test.
          if (orchestratorToken.length >= 40 && orchestratorToken.length <= 200) {
            const baseSha = String(process.env.GITHUB_SHA || "").toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("Runner main commit SHA is unavailable or invalid.");
            try {
              const seeded = await request("/agent/v1/work-packages", {
                method: "POST",
                body: JSON.stringify({
                  idempotencyKey: `mehran-intelligence-fixed-tests-${baseSha}`,
                  title: "MEHRAN INTELLIGENCE isolated repository test",
                  objective: "Run the one fixed Intelligence policy test suite against this immutable main commit inside a no-network, read-only, resource-limited container.",
                  priority: "normal",
                  scope: {
                    mode: "isolated_ci",
                    mission: "Execute only scripts/intelligence-capabilities.test.mjs at the exact main commit.",
                    allowedActions: ["run_repository_tests"],
                    forbidden: ["arbitrary_commands", "network_access_in_container", "repository_writes", "secret_access", "deployment", "wallet_operations"]
                  },
                  tasks: [{
                    taskId: "fixed-tests",
                    title: "Run the fixed isolated Intelligence test suite",
                    description: "Verify the exact immutable main commit is an ancestor of this runner's main checkout, then execute only the fixed Node test file in the pinned no-network read-only container. Return bounded test counts and container-policy evidence.",
                    actionType: "run_repository_tests",
                    dependsOn: [],
                    baseSha
                  }]
                })
              }, ownerHeaders, 30000);
              if (seeded.workPackageId) packageIds.add(seeded.workPackageId);
              console.log(`Fixed test package: ${seeded.status || "unknown"}; duplicate=${Boolean(seeded.duplicate)}; tasks=${seeded.taskCount || 0}; baseSha=${baseSha.slice(0,12)}`);
            } catch (error) {
              console.log("Fixed test package seeding failed closed: " + String(error?.message || error).slice(0,240));
            }
          }

          function runHost(command, args, timeoutMs = 30000) {
            const result = spawnSync(command, args, { encoding: "utf8", timeout: timeoutMs, maxBuffer: 1024 * 1024 });
            if (result.error) throw new Error(`${command} failed: ${String(result.error.message || result.error).slice(0,160)}`);
            if (result.status !== 0) throw new Error(`${command} exited ${result.status}: ${String(result.stderr || result.stdout || "").slice(0,180)}`);
            return String(result.stdout || "").trim();
          }

          function runFixedRepositoryTests(task) {
            let payload = {};
            try {
              payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
            } catch {
              throw new Error("Test task payload is not valid JSON.");
            }
            const baseSha = String(payload.baseSha || "").toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("Test task requires one exact 40-character base SHA.");
            const currentSha = String(process.env.GITHUB_SHA || runHost("git", ["rev-parse", "HEAD"])).toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(currentSha)) throw new Error("Runner checkout SHA is invalid.");
            runHost("git", ["merge-base", "--is-ancestor", baseSha, currentSha]);
            const tempRoot = mkdtempSync(join(tmpdir(), "mehran-intelligence-tests-"));
            const workspace = join(tempRoot, "repo");
            try {
              runHost("git", ["worktree", "add", "--detach", workspace, baseSha]);
              const image = "node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a";
              const args = [
                "run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                "--security-opt", "no-new-privileges", "--pids-limit", "64", "--memory", "768m",
                "--cpus", "1", "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=64m",
                "--mount", `type=bind,src=${workspace},dst=/workspace,readonly`,
                "--workdir", "/workspace", image, "sh", "-c",
                "node --check worker.js && node --check scripts/intelligence-capabilities.mjs && node --test --test-reporter=tap scripts/intelligence-capabilities.test.mjs"
              ];
              const result = spawnSync("docker", args, { encoding: "utf8", timeout: 240000, maxBuffer: 1024 * 1024 });
              const output = [result.stdout || "", result.stderr || ""].join("\n").slice(-24000);
              const total = Number(output.match(/^# tests (\d+)$/m)?.[1] || 0);
              const passed = Number(output.match(/^# pass (\d+)$/m)?.[1] || 0);
              const failed = Number(output.match(/^# fail (\d+)$/m)?.[1] || 0);
              const exitCode = Number.isInteger(result.status) ? result.status : 1;
              return {
                type: "run_repository_tests",
                generatedAt: new Date().toISOString(),
                mode: "isolated_fixed_repository_test",
                repository: "Mehranmsh/mehranmsh.github.io",
                baseSha,
                workflowRunId: String(process.env.GITHUB_RUN_ID || ""),
                workflowAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0),
                testSuite: "scripts/intelligence-capabilities.test.mjs",
                tests: { total, passed, failed },
                exitCode,
                outputSha256: createHash("sha256").update(output).digest("hex"),
                container: {
                  network: "none", readOnly: true, capDropAll: true, noNewPrivileges: true,
                  memoryMb: 768, cpus: 1, pidsLimit: 64
                },
                passed: exitCode === 0 && total > 0 && passed === total && failed === 0
              };
            } finally {
              try { runHost("git", ["worktree", "remove", "--force", workspace]); } catch {}
              rmSync(tempRoot, { recursive: true, force: true });
            }
          }

          async function execute(task) {
            if (!task || task.status !== "in_progress" || task.requiresApproval !== false || !["mehran_intelligence", "shared"].includes(task.assignedTo)) {
              throw new Error("Claimed task failed assignment, approval, or status validation.");
            }
            if (task.actionType === "run_repository_tests") {
              return runFixedRepositoryTests(task);
            }
            if (task.actionType === "propose_code_patch") {
              let payload = {};
              let checkpoint = {};
              try {
                payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
                checkpoint = typeof task.checkpoint === "string" ? JSON.parse(task.checkpoint || "{}") : (task.checkpoint || {});
              } catch {
                throw new Error("Patch proposal task payload or checkpoint is not valid JSON.");
              }
              const objective = typeof payload.objective === "string" ? payload.objective.trim() : "";
              if (objective.length < 12 || objective.length > 800) {
                throw new Error("Patch proposal task requires one bounded objective.");
              }
              let baseSha = String(checkpoint.baseSha || "").toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(baseSha)) {
                const headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                  "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
                };
                const response = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io/commits/main", {
                  headers, signal: AbortSignal.timeout(15000)
                });
                if (!response.ok) throw new Error(`GitHub main commit lookup HTTP ${response.status}`);
                const commit = await response.json();
                baseSha = String(commit?.sha || "").toLowerCase();
                if (!/^[a-f0-9]{40}$/.test(baseSha)) throw new Error("GitHub returned an invalid main commit SHA.");
                const saved = await request(`/agent/v1/tasks/${encodeURIComponent(task.id)}/checkpoint`, {
                  method: "POST",
                  body: JSON.stringify({ checkpoint: { baseSha }, claimToken: task.claimToken })
                });
                if (!saved.checkpointSaved) throw new Error("Immutable patch base commit could not be checkpointed.");
              }
              const proposal = await request("/agent/v1/patch-proposals/generate", {
                method: "POST",
                body: JSON.stringify({ baseSha, objective, requestId: task.id })
              }, agentHeaders, 90000);
              if (proposal.requestId !== task.id || proposal.status !== "stored" ||
                  !/^[A-Za-z0-9_-]{43}$/.test(proposal.requestHash || "") ||
                  !/^[a-f0-9-]{36}$/.test(proposal.proposalId || "") ||
                  !/^[a-f0-9]{64}$/.test(proposal.artifactSha256 || "") ||
                  !/^[a-f0-9]{64}$/.test(proposal.diffSha256 || "")) {
                throw new Error("Patch generation API returned incomplete or unverified proposal metadata.");
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                requestId: proposal.requestId,
                requestHash: proposal.requestHash,
                proposalId: proposal.proposalId,
                path: proposal.path,
                artifactSha256: proposal.artifactSha256,
                diffSha256: proposal.diffSha256,
                status: proposal.status,
                baseSha,
                targetPath: proposal.targetPath,
                validationMode: proposal.validationMode,
                summary: proposal.summary
              };
            }
            if (task.actionType === "service_health_report") {
              const health = await request("/health", {}, { "Accept": "application/json" });
              if (health.status !== "online" || health.database !== true) {
                throw new Error("Worker or D1 health check did not pass.");
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                worker: health.status,
                database: health.database,
                scheduler: health.scheduler || null,
                scope: "Read-only Worker health endpoint."
              };
            }
            if (task.actionType === "repository_quality_check") {
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
              };
              const repoResponse = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io", {
                headers, signal: AbortSignal.timeout(12000)
              });
              if (!repoResponse.ok) throw new Error(`GitHub repository metadata HTTP ${repoResponse.status}`);
              const metadata = await repoResponse.json();
              if (metadata.full_name !== "Mehranmsh/mehranmsh.github.io") throw new Error("Unexpected repository identity.");
              const commitResponse = await fetch("https://api.github.com/repos/Mehranmsh/mehranmsh.github.io/commits?per_page=1", {
                headers, signal: AbortSignal.timeout(12000)
              });
              if (!commitResponse.ok) throw new Error(`GitHub latest commit HTTP ${commitResponse.status}`);
              const commits = await commitResponse.json();
              const latest = Array.isArray(commits) ? commits[0] : null;
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                repository: metadata.full_name,
                defaultBranch: metadata.default_branch || null,
                openIssues: Number(metadata.open_issues_count || 0),
                lastPushedAt: metadata.pushed_at || null,
                latestCommit: latest?.sha ? latest.sha.slice(0, 12) : null,
                latestCommitAt: latest?.commit?.committer?.date || latest?.commit?.author?.date || null,
                scope: "Public GitHub metadata only. No source execution or repository writes."
              };
            }
            if (task.actionType === "inspect_repository") {
              const repository = "Mehranmsh/mehranmsh.github.io";
              const allowedPaths = new Set([
                "worker.js",
                "scripts/intelligence-agent.mjs",
                "scripts/intelligence-capabilities.mjs",
                "scripts/intelligence-capabilities.test.mjs",
                ".github/workflows/mehran-intelligence-runner.yml",
                "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
              ]);
              let payload = {};
              try {
                payload = typeof task.actionPayload === "string" ? JSON.parse(task.actionPayload) : (task.actionPayload || {});
              } catch {
                throw new Error("Inspection task payload is not valid JSON.");
              }
              const paths = payload.paths;
              if (!Array.isArray(paths) || paths.length < 1 || paths.length > 6 ||
                  new Set(paths).size !== paths.length || paths.some(path => typeof path !== "string" || !allowedPaths.has(path))) {
                throw new Error("Inspection paths are outside the exact read-only allowlist.");
              }
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
              };
              if ((process.env.GITHUB_TOKEN || "").length < 20) throw new Error("GitHub read token is unavailable.");
              const commitResponse = await fetch(`https://api.github.com/repos/${repository}/commits/main`, {
                headers, signal: AbortSignal.timeout(15000)
              });
              if (!commitResponse.ok) throw new Error(`GitHub main commit lookup HTTP ${commitResponse.status}`);
              const commit = await commitResponse.json();
              if (typeof commit.sha !== "string" || !/^[a-f0-9]{40}$/i.test(commit.sha)) throw new Error("GitHub returned an invalid main commit SHA.");
              const files = [];
              let totalBytes = 0;
              for (const path of paths) {
                const apiPath = path.split("/").map(encodeURIComponent).join("/");
                const response = await fetch(`https://api.github.com/repos/${repository}/contents/${apiPath}?ref=${commit.sha}`, {
                  headers, signal: AbortSignal.timeout(15000)
                });
                if (!response.ok) throw new Error(`GitHub source read failed for allowlisted path ${path}: HTTP ${response.status}`);
                const file = await response.json();
                if (file.type !== "file" || file.path !== path || file.encoding !== "base64" ||
                    typeof file.content !== "string" || typeof file.sha !== "string" || !/^[a-f0-9]{40}$/i.test(file.sha) ||
                    !Number.isInteger(file.size) || file.size < 0 || file.size > 500000) {
                  throw new Error(`GitHub returned an invalid or oversized source file for ${path}.`);
                }
                const source = Buffer.from(file.content.replace(/\n/g, ""), "base64").toString("utf8");
                const bytes = Buffer.byteLength(source, "utf8");
                if (bytes !== file.size) throw new Error(`GitHub source size verification failed for ${path}.`);
                totalBytes += bytes;
                if (totalBytes > 750000) throw new Error("Inspection exceeded the 750 KB aggregate source limit.");
                const symbols = new Set();
                const patterns = [
                  /^\s*(?:export\s+)?(?:async\s+)?(?:function|class)\s+([A-Za-z_$][\w$]*)/gm,
                  /^\s*(?:export\s+)?(?:const|let|var)\s+([A-Za-z_$][\w$]*)/gm
                ];
                for (const pattern of patterns) {
                  let match;
                  while ((match = pattern.exec(source)) && symbols.size < 2) symbols.add(match[1]);
                }
                files.push({
                  path,
                  blobSha: file.sha,
                  bytes,
                  lineCount: source.length ? source.split(/\r\n|\n|\r/).length : 0,
                  symbols: [...symbols].map(symbol => symbol.slice(0, 60))
                });
              }
              return {
                type: task.actionType,
                generatedAt: new Date().toISOString(),
                mode: "bounded_read_only_repository_inspection",
                repository,
                commitSha: commit.sha,
                summary: { filesInspected: files.length, totalBytes },
                files,
                limitations: [
                  "Read-only source inventory and declaration extraction; not a semantic code review.",
                  "Repository content was treated as untrusted data and was never executed or followed as instructions.",
                  "Only exact allowlisted files at one immutable main commit were read."
                ]
              };
            }
            if (task.actionType === "source_security_audit") {
              const repo = "Mehranmsh/mehranmsh.github.io";
              async function readSource(path) {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=main`, {
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization": `Bearer ${process.env.GITHUB_TOKEN || ""}`,
                    "User-Agent": "MEHRAN-MSH-INTELLIGENCE"
                  },
                  signal: AbortSignal.timeout(20000)
                });
                if (!response.ok) throw new Error(`GitHub source read failed for ${path}: HTTP ${response.status}`);
                const file = await response.json();
                if (file.type !== "file" || typeof file.content !== "string" || file.encoding !== "base64") throw new Error(`Unexpected GitHub content response for ${path}`);
                return { text: Buffer.from(file.content.replace(/\n/g, ""), "base64").toString("utf8"), sha: file.sha, size: Number(file.size || 0) };
              }
              const [workerSource, runnerSource, protocolSource] = await Promise.all([
                readSource("worker.js"),
                readSource(".github/workflows/mehran-intelligence-runner.yml"),
                readSource("docs/INTELLIGENCE_EXECUTION_PROTOCOL.md")
              ]);
              const officialGuidanceSources = [
                { label: "GitHub Actions security hardening", url: "https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions" },
                { label: "Cloudflare Workers AI documentation", url: "https://developers.cloudflare.com/workers-ai/" },
                { label: "OWASP Top 10 for LLM Applications", url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/" }
              ];
              async function readOfficialGuidance(source) {
                const allowed = officialGuidanceSources.some(item => item.url === source.url && item.label === source.label);
                if (!allowed) throw new Error("Research source is outside the fixed official documentation allowlist.");
                try {
                  const response = await fetch(source.url, {
                    method: "GET",
                    redirect: "error",
                    headers: { "Accept": "text/html", "User-Agent": "MEHRAN-MSH-INTELLIGENCE-RESEARCH" },
                    signal: AbortSignal.timeout(12000)
                  });
                  if (!response.ok) return { label: source.label, url: source.url, status: "unavailable", httpStatus: response.status };
                  const contentType = response.headers.get("content-type") || "";
                  if (!contentType.toLowerCase().includes("text/html")) {
                    return { label: source.label, url: source.url, status: "rejected", reason: "unexpected_content_type" };
                  }
                  const reader = response.body?.getReader();
                  if (!reader) return { label: source.label, url: source.url, status: "unavailable", reason: "empty_response_body" };
                  const chunks = [];
                  let totalBytes = 0;
                  while (true) {
                    const part = await reader.read();
                    if (part.done) break;
                    totalBytes += part.value.byteLength;
