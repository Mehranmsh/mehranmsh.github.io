name: Import recorded instrument samples

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recorded-instrument-import
  cancel-in-progress: false

jobs:
  import-cc0-samples:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out MEHRAN MUSIC
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio conversion tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Audit public CC0 PCMIR archive for Persian instrument recordings
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile, collections
          url = "https://raw.githubusercontent.com/SeyedMuhammadHosseinMousavi/Persian-Classical-Music-Instrument-Recognition-PCMIR-Using-a-Novel-Persian-Music-Database/main/PCMIR%20Small.zip"
          request = urllib.request.Request(url, headers={"User-Agent":"MEHRAN-MUSIC sample-library audit"})
          with urllib.request.urlopen(request, timeout=90) as response:
              archive_bytes = response.read()
          print(f"PCMIR archive bytes: {len(archive_bytes)}")
          z = zipfile.ZipFile(io.BytesIO(archive_bytes))
          files = [x for x in z.infolist() if not x.is_dir()]
          print(f"PCMIR archive file count: {len(files)}")
          groups = collections.Counter()
          for item in files:
              parts = item.filename.replace("\\\\", "/").split("/")
              label = next((p for p in parts if p.lower() in {"ney","tar","santur","kamancheh","tonbak","oud","ud","setar"}), "UNCLASSIFIED")
              if item.filename.lower().endswith((".wav",".mp3",".ogg",".flac")):
                  groups[label] += 1
          print("Audio files by folder:", dict(groups))
          for item in files:
              if item.filename.lower().endswith((".wav",".mp3",".ogg",".flac")):
                  print(f"AUDIO {item.file_size:>10} bytes | {item.filename}")
          PY

      - name: Deep-audit Persian recordings before any instrument import
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile, hashlib, collections, json, subprocess, tempfile, os, statistics
          url = "https://raw.githubusercontent.com/SeyedMuhammadHosseinMousavi/Persian-Classical-Music-Instrument-Recognition-PCMIR-Using-a-Novel-Persian-Music-Database/main/PCMIR%20Small.zip"
          req = urllib.request.Request(url, headers={"User-Agent":"MEHRAN-MUSIC audio quality audit"})
          with urllib.request.urlopen(req, timeout=90) as r:
              archive = r.read()
          z = zipfile.ZipFile(io.BytesIO(archive))
          grouped = collections.defaultdict(list)
          for item in z.infolist():
              if item.is_dir() or not item.filename.lower().endswith((".mp3",".wav",".flac",".ogg")):
                  continue
              parts = item.filename.replace("\\\\", "/").split("/")
              name = next((p.lower() for p in parts if p.lower() in {"ney","tar","santur","kamancheh"}), "unknown")
              grouped[name].append(item)
          for name, items in sorted(grouped.items()):
              hashes = collections.Counter()
              durations, rates, channels, codecs = [], [], [], collections.Counter()
              print(f"\n=== {name.upper()} | files={len(items)} ===")
              for item in items:
                  raw = z.read(item)
                  hashes[hashlib.sha256(raw).hexdigest()] += 1
                  suffix = os.path.splitext(item.filename)[1] or ".audio"
                  with tempfile.NamedTemporaryFile(suffix=suffix) as tmp:
                      tmp.write(raw); tmp.flush()
                      p = subprocess.run(["ffprobe","-v","error","-select_streams","a:0","-show_entries","stream=codec_name,sample_rate,channels,duration:format=duration","-of","json",tmp.name],capture_output=True,text=True)
                  if p.returncode:
                      print("PROBE_ERROR", item.filename, p.stderr[:180])
                      continue
                  info = json.loads(p.stdout)
                  stream = (info.get("streams") or [{}])[0]
                  duration = float(stream.get("duration") or info.get("format",{}).get("duration") or 0)
                  durations.append(duration)
                  rates.append(int(stream.get("sample_rate") or 0))
                  channels.append(int(stream.get("channels") or 0))
                  codecs[stream.get("codec_name","unknown")] += 1
              print("unique_audio_hashes:",len(hashes),"duplicate_files:",sum(v-1 for v in hashes.values()))
              print("codec_counts:",dict(codecs))
              print("sample_rates_hz:",dict(collections.Counter(rates)))
              print("channel_counts:",dict(collections.Counter(channels)))
              if durations:
                  print("duration_seconds_min_median_max:",round(min(durations),3),round(statistics.median(durations),3),round(max(durations),3))
              print("file_size_bytes_min_max:",min(x.file_size for x in items),max(x.file_size for x in items))
          print("\nDeep audit complete. No PCMIR samples have been added to the playable instrument manifest.")
          PY

      - name: Analyze pitch and usable note coverage of Persian recordings
        run: |
          python -m pip install --quiet numpy scipy librosa
          python - <<'PY'
          import io, urllib.request, zipfile, collections, os, tempfile, subprocess, json
          import numpy as np
          import librosa
          url = "https://raw.githubusercontent.com/SeyedMuhammadHosseinMousavi/Persian-Classical-Music-Instrument-Recognition-PCMIR-Using-a-Novel-Persian-Music-Database/main/PCMIR%20Small.zip"
          req = urllib.request.Request(url, headers={"User-Agent":"MEHRAN-MUSIC pitch coverage audit"})
          with urllib.request.urlopen(req, timeout=90) as r:
              z = zipfile.ZipFile(io.BytesIO(r.read()))
          groups = collections.defaultdict(list)
          for item in z.infolist():
              if item.is_dir() or not item.filename.lower().endswith((".mp3",".wav",".flac",".ogg")):
                  continue
              parts = item.filename.replace("\\\\","/").split("/")
              instrument = next((p.lower() for p in parts if p.lower() in {"ney","tar","santur","kamancheh"}), "unknown")
              groups[instrument].append(item)
          for instrument, items in sorted(groups.items()):
              pitches, usable, silent = [], 0, 0
              print(f"\n=== NOTE COVERAGE {instrument.upper()} ({len(items)} files) ===")
              for item in sorted(items, key=lambda x:x.filename):
                  suffix = os.path.splitext(item.filename)[1] or ".mp3"
                  with tempfile.NamedTemporaryFile(suffix=suffix) as tmp:
                      tmp.write(z.read(item)); tmp.flush()
                      p = subprocess.run(["ffmpeg","-nostdin","-y","-loglevel","error","-i",tmp.name,"-ac","1","-ar","22050","-f","wav","pipe:1"],capture_output=True)
                  if p.returncode:
                      print("DECODE_FAIL",item.filename); continue
                  import soundfile as sf
                  y, sr = sf.read(io.BytesIO(p.stdout), dtype="float32")
                  if len(y) < sr:
                      print("TOO_SHORT",item.filename); continue
                  rms = float(np.sqrt(np.mean(y*y)))
                  if rms < 0.003:
                      silent += 1
                      print("LOW_LEVEL",round(rms,5),item.filename); continue
                  f0 = librosa.yin(y, fmin=65, fmax=1400, sr=sr, frame_length=2048, hop_length=512)
                  f0 = f0[np.isfinite(f0)]
                  if not len(f0):
                      print("NO_PITCH",item.filename); continue
                  hz = float(np.median(f0))
                  midi = int(round(69 + 12*np.log2(hz/440)))
                  cents = round(100*(69 + 12*np.log2(hz/440)-midi),1)
                  pitches.append(midi); usable += 1
                  print(f"NOTE midi={midi} cents={cents:+} median_hz={hz:.1f} rms={rms:.4f} | {item.filename}")
              print("SUMMARY usable:",usable,"low_level:",silent,"unique_midi:",sorted(set(pitches)))
              if pitches:
                  print("SUMMARY midi_span:",min(pitches),max(pitches),"unique_note_count:",len(set(pitches)))
          print("\nPitch audit only. These recordings remain unimported until note coverage and license scope are reviewed.")
          PY

      - name: Import additional recorded instrument banks, including handpan
        run: python scripts/import-additional-instruments.py

      - name: Import real female and male human vocal samples
        run: python scripts/import-vocalset.py

      - name: Validate imported sample bank
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/instruments/manifest.json")
          data = json.loads(p.read_text())
          expected = {
              "acoustic_grand_piano": 352,
              "acoustic_guitar_steel": 375,
              "acoustic_guitar_nylon": 348,
          }
          for key, count in expected.items():
              samples = data["instruments"][key]["samples"]
              assert len(samples) == count, (key, len(samples), count)
              for sample in samples:
                  file = Path("assets/instruments") / sample["url"].removeprefix("./assets/instruments/")
                  assert file.is_file() and file.stat().st_size > 128, str(file)
          for key in ["violin", "cello", "acoustic_bass", "kalimba", "setar", "cajon", "world_percussion", "acoustic_drums", "electric_bass", "bassoon", "clarinet", "flute", "french_horn", "electric_guitar", "harmonium", "harp", "organ", "saxophone", "trombone", "trumpet", "tuba", "xylophone"]:
              samples = data["instruments"][key]["samples"]
              assert len(samples) >= 8, (key, len(samples))
              for sample in samples:
                  file = Path("assets/instruments") / sample["url"].removeprefix("./assets/instruments/")
                  assert file.is_file() and file.stat().st_size > 128, str(file)
          assert len(data["instruments"]["cajon"]["samples"]) >= 20
          assert len(data["instruments"]["world_percussion"]["samples"]) >= 150
          assert len(data["instruments"]["acoustic_drums"]["samples"]) == 128
          violin = data["instruments"]["violin"]
          assert len(violin["samples"]) == 45, ("violin", len(violin["samples"]))
          assert "CC0-1.0" in violin.get("license", "")
          assert violin.get("expectedKeyRange") == [55, 98]
          assert len([s for s in violin["samples"] if s.get("sourceSha256")]) == 30
          assert len([s for s in violin["samples"] if s.get("sourceBank") == "ToneJS legacy"]) == 15
          assert {s["rootNote"] for s in violin["samples"]} == {55,57,60,64,67,69,72,76,79,81,84,88,91,93,96}
          assert {round(s["velocityMin"]*127) for s in violin["samples"]} == {0,64}
          assert all((Path("assets/instruments") / s["url"].removeprefix("./assets/instruments/")).is_file() for s in violin["samples"])
          xylophone = data["instruments"]["xylophone"]
          assert len(xylophone["samples"]) == 18
          assert {round(s["velocityMin"]*127) for s in xylophone["samples"]} == {0,84}
          assert all((Path("assets/instruments") / s["url"].removeprefix("./assets/instruments/")).is_file() for s in xylophone["samples"])
          handpan = data["instruments"]["handpan"]
          assert len(handpan["samples"]) == 51
          assert {s["rootNote"] for s in handpan["samples"]} == {57,62,64,65,67,69,70,72,74}
          assert handpan.get("roundRobin") is True
          assert all((Path("assets/instruments") / s["url"].removeprefix("./assets/instruments/")).is_file() for s in handpan["samples"])
          for key, expected in {"female_vocal":45,"male_vocal":55,"female_choir":45,"male_choir":55,"mixed_choir":100}.items():
              samples = data["instruments"][key]["samples"]
              assert len(samples) == expected, (key, len(samples), expected)
              if key.endswith("_choir"):
                  assert data["instruments"][key].get("layered") is True
              for sample in samples:
                  file = Path("assets/instruments") / sample["url"].removeprefix("./assets/instruments/")
                  assert file.is_file() and file.stat().st_size > 256, str(file)
                  assert sample["loopEnd"] > sample["loopStart"] >= 0
                  assert 30 <= sample["rootNote"] <= 90
          assert (Path("assets/instruments/samples/vocalset/VOCALSET-ATTRIBUTION.txt")).is_file()
          print("Recorded instrument and human vocal sample bank validation passed.")
          PY

      - name: Commit self-hosted samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instruments/manifest.json assets/instruments/samples
          if git diff --cached --quiet; then
            echo "No sample changes to commit."
          else
            git commit -m "Import CC0 recorded piano, guitar and human vocal banks"
            git pull --rebase origin main
            git push
          fi
