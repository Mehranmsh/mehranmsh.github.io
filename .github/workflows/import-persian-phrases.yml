name: Import Persian recorded phrase previews

on:
  push:
    paths:
      - ".github/workflows/import-persian-phrases.yml"
      - "assets/instruments/phrases/persian/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MEHRAN MUSIC
        uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar ffmpeg
      - name: Download licensed PCMIR recordings and convert selected phrases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pcmir/extracted assets/instruments/phrases/persian
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://data.mendeley.com/public-files/datasets/bpyxwkv9wj/files/fe2e9091-1b8c-4ae0-b331-725b45431125/file_downloaded" \
            --output /tmp/pcmir-source.rar
          unar -quiet -o /tmp/pcmir/extracted /tmp/pcmir-source.rar > /tmp/pcmir/extraction.log 2>&1 || true
          ROOT="/tmp/pcmir/extracted/Persian Classical Music Instrument Recognition (PCMIR) Database"
          test -s "$ROOT/Tar/Tar (1).mp3"
          test -s "$ROOT/Santur/Santur (1).mp3"
          test -s "$ROOT/Ney/Ney (1).mp3"
          test -s "$ROOT/Kamancheh/Kamancheh (1).mp3"
          for instrument in Tar Santur Ney Kamancheh; do
            lower="$(printf '%s' "$instrument" | tr '[:upper:]' '[:lower:]')"
            mapfile -t recordings < <(find "$ROOT/$instrument" -maxdepth 1 -type f -iname '*.mp3' | sort -V | head -n 4)
            if [ "${#recordings[@]}" -lt 4 ]; then
              echo "Expected at least four real $instrument recordings; found ${#recordings[@]}" >&2
              exit 1
            fi
            for index in 0 1 2 3; do
              number="$(printf '%02d' "$((index+1))")"
              ffmpeg -nostdin -y -v error -i "${recordings[$index]}" -ar 44100 -ac 1 -c:a libvorbis -q:a 5 "assets/instruments/phrases/persian/$lower-phrase-$number.ogg"
            done
          done
          cat > assets/instruments/phrases/persian/README.txt <<'EOF'
          MEHRAN MUSIC Persian recorded phrase previews

          These are short real-performance excerpts (four per instrument), not isolated notes or full chromatic multisample banks.
          Intended use: one-shot phrase playback in MEHRAN MUSIC. Do not pitch-shift them and label them as playable multisampled instruments.

          Dataset: Persian Classical Music Instrument Recognition (PCMIR) Database
          DOI: 10.17632/bpyxwkv9wj.1
          Source: https://data.mendeley.com/datasets/bpyxwkv9wj/1
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          License URL: https://creativecommons.org/licenses/by/4.0/

          Attribution:
          Mousavi, Seyed Muhammad Hossein; Prasath, V. B. Surya; Mousavi, Seyed Muhammad Hassan.
          Persian Classical Music Instrument Recognition (PCMIR) Database, 2020.

          Changes: four selected real-performance excerpts per instrument transcoded from MP3 to OGG Vorbis for local same-origin playback.
          EOF
          cat > assets/instruments/phrases/persian/manifest.json <<'EOF'
          {
            "schemaVersion": 1,
            "libraryRevision": 2,
            "name": "MEHRAN Persian Recorded Phrases",
            "kind": "one-shot-phrase-library",
            "source": "PCMIR Persian Classical Music Instrument Recognition Database",
            "license": "CC-BY-4.0",
            "sourceUrl": "https://data.mendeley.com/datasets/bpyxwkv9wj/1",
            "attribution": "Mousavi, Seyed Muhammad Hossein; Prasath, V. B. Surya; Mousavi, Seyed Muhammad Hassan. Persian Classical Music Instrument Recognition (PCMIR) Database, 2020.",
            "instruments": {
              "tar": {"displayName": "Persian Tar", "kind": "recorded-phrase", "samples": ["./assets/instruments/phrases/persian/tar-phrase-01.ogg", "./assets/instruments/phrases/persian/tar-phrase-02.ogg", "./assets/instruments/phrases/persian/tar-phrase-03.ogg", "./assets/instruments/phrases/persian/tar-phrase-04.ogg"]},
              "santur": {"displayName": "Persian Santur", "kind": "recorded-phrase", "samples": ["./assets/instruments/phrases/persian/santur-phrase-01.ogg", "./assets/instruments/phrases/persian/santur-phrase-02.ogg", "./assets/instruments/phrases/persian/santur-phrase-03.ogg", "./assets/instruments/phrases/persian/santur-phrase-04.ogg"]},
              "ney": {"displayName": "Persian Ney", "kind": "recorded-phrase", "samples": ["./assets/instruments/phrases/persian/ney-phrase-01.ogg", "./assets/instruments/phrases/persian/ney-phrase-02.ogg", "./assets/instruments/phrases/persian/ney-phrase-03.ogg", "./assets/instruments/phrases/persian/ney-phrase-04.ogg"]},
              "kamancheh": {"displayName": "Persian Kamancheh", "kind": "recorded-phrase", "samples": ["./assets/instruments/phrases/persian/kamancheh-phrase-01.ogg", "./assets/instruments/phrases/persian/kamancheh-phrase-02.ogg", "./assets/instruments/phrases/persian/kamancheh-phrase-03.ogg", "./assets/instruments/phrases/persian/kamancheh-phrase-04.ogg"]}
            }
          }
          EOF
      - name: Verify phrase assets
        run: |
          set -euo pipefail
          for file in assets/instruments/phrases/persian/*.ogg; do
            test -s "$file"
            ffprobe -v error -show_entries format=duration:stream=sample_rate,channels -of compact=p=0:nk=1 "$file"
          done
      - name: Commit self-hosted phrase assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instruments/phrases/persian/
          if git diff --cached --quiet; then
            echo "No new phrase assets to commit."
          else
            git commit -m "Add CC BY Persian recorded phrase previews"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push; then
                exit 0
              fi
              echo "Push raced with another MEHRAN commit; retrying after rebase ($attempt/5)."
              sleep 2
            done
            echo "Could not push phrase assets after five rebase attempts." >&2
            exit 1
          fi
