name: MEHRAN MUSIC STUDIO Browser Tests

on:
  push:
    branches:
      - main
    paths:
      - "music-studio.html"
      - "scripts/browser-smoke.py"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    paths:
      - "music-studio.html"
      - "scripts/browser-smoke.py"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-e2e:
    name: Chromium end-to-end audio workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: python scripts/browser-smoke.py
