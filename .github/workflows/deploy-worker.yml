name: Deploy Cloudflare Worker

on:
  # Keep ordinary Worker source merges non-deploying. This narrowly scoped
  # push trigger lets an owner-approved deployment-workflow change deploy the
  # already-tested main revision without requiring a paid browser automation.
  # Owner-approved deployment: publish the merged deterministic inspection fix.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: mehran-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
