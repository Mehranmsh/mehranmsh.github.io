name: MEHRAN INTELLIGENCE Agent Runner

on:
  push:
    paths:
      - ".github/workflows/intelligence-agent.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mehran-intelligence-agent
  cancel-in-progress: false

jobs:
  execute-approved-task:
    name: Poll and execute one approved task
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEHRAN_AGENT_TOKEN: ${{ secrets.MEHRAN_AGENT_TOKEN }}
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute one allowlisted Intelligence task
        if: env.MEHRAN_AGENT_TOKEN != ''
        run: node scripts/intelligence-agent.mjs

      - name: Explain missing service identity
        if: env.MEHRAN_AGENT_TOKEN == ''
        run: echo "MEHRAN_AGENT_TOKEN repository secret is not configured; no task was claimed or executed."
