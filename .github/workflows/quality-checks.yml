name: MEHRAN MSH Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "worker.js"
      - "scripts/**"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "worker.js"
      - "scripts/**"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    name: JavaScript and HTML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run MEHRAN MSH quality checks
        run: python scripts/quality-check.py
