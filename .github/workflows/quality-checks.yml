name: MEHRAN MSH Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - "engine/**"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - "engine/**"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    name: JavaScript, HTML, and Worker smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run syntax checks
        run: python scripts/quality-check.py

      - name: Run Worker smoke tests
        run: node --test scripts/worker-smoke.test.mjs

      - name: Run local Music Studio control-plane tests
        run: python -m unittest discover -s engine -p 'test_*.py' -v

  engine-container-build:
    name: Build and validate private engine container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the private engine image
        run: docker build --file engine/Dockerfile --tag mehran-music-engine:ci .

      - name: Validate isolated Compose deployment
        env:
          MEHRAN_STUDIO_TOKEN: ci-only-not-a-real-secret-0123456789abcdef0123456789
          CLOUDFLARE_TUNNEL_TOKEN: ci-only-cloudflare-placeholder
        run: docker compose --env-file .env.example -f docker-compose.engine.yml config --quiet
      - name: Smoke-test live container health and authentication
        env:
          MEHRAN_STUDIO_TOKEN: ci-only-not-a-real-secret-0123456789abcdef0123456789
        run: |
          set -euo pipefail
          docker run -d --name mehran-engine-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:18765:8765 \
            -e MEHRAN_STUDIO_TOKEN="$MEHRAN_STUDIO_TOKEN" \
            -e MEHRAN_STUDIO_HOME=/tmp/mehran-ci \
            -e MEHRAN_STUDIO_HOST=0.0.0.0 \
            -e MEHRAN_STUDIO_PORT=8765 \
            -e MEHRAN_STUDIO_ALLOW_CONTAINER_BIND=1 \
            mehran-music-engine:ci
          trap 'docker rm -f mehran-engine-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail -H "Authorization: Bearer $MEHRAN_STUDIO_TOKEN" \
              http://127.0.0.1:18765/health -o /tmp/mehran-health.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; d=json.load(open('/tmp/mehran-health.json')); assert d['service']=='mehran-music-studio-control'; assert 'engine' in d and 'resources' in d"
          status=$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/health)
          test "$status" = "401"
