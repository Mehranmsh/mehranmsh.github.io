name: MEHRAN MSH Quality Checks
# Re-run smoke coverage for the collaboration Task Hub.

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - "engine/**"
      - "instrument-sampler.js"
      - "assets/instruments/**"
      - ".github/workflows/quality-checks.yml"
      - ".github/workflows/mehran-intelligence-runner.yml"
      - ".github/workflows/mehran-intelligence-runner.yml"
  pull_request:
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - "engine/**"
      - "instrument-sampler.js"
      - "assets/instruments/**"
      - ".github/workflows/quality-checks.yml"
      - ".github/workflows/mehran-intelligence-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    name: JavaScript, HTML, and Worker smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run syntax checks
        run: python scripts/quality-check.py

      - name: Verify runner package tracking declaration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const source = readFileSync(".github/workflows/mehran-intelligence-runner.yml", "utf8");
          assert.match(source, /const packageIds = new Set\(\);/,
            "runner must initialize packageIds as a Set before task processing");
          assert.match(source, /packageIds\.add\(task\.workPackageId\)/,
            "claimed work packages must be tracked");
          assert.match(source, /packageIds\.size/,
            "finalization must check the tracked package set");
          console.log("PASS: packageIds is initialized as a Set and supports claim/finalization use.");
          NODE

      - name: Run Worker smoke tests
        run: node --test scripts/worker-smoke.test.mjs

      - name: Run Intelligence patch generation service retry tests
        run: node --test scripts/intelligence-patch-generation-service.test.mjs

      - name: Run Intelligence capability policy tests
        run: node --check scripts/intelligence-capabilities.mjs && node --test scripts/intelligence-capabilities.test.mjs

      - name: Run Intelligence bounded result serialization tests
        run: node --test scripts/intelligence-result-serializer.test.mjs

      - name: Run Intelligence report finalization safety tests
        run: node --check scripts/intelligence-report-finalization.mjs && node --test scripts/intelligence-report-finalization.test.mjs

      - name: Run Intelligence security audit pattern regression tests
        run: node --test scripts/intelligence-security-audit-patterns.test.mjs
      - name: Run Intelligence autonomous verification and repair loop tests
        run: node --check scripts/intelligence-verification-loop.mjs && node --test scripts/intelligence-verification-loop.test.mjs

      - name: Run Intelligence central module registry tests
        run: node --check scripts/intelligence-module-registry.mjs && node --test scripts/intelligence-module-registry.test.mjs

      - name: Run local Music Studio control-plane tests
        run: python -m unittest discover -s engine -p 'test_*.py' -v
