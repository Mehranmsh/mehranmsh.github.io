name: MEHRAN MSH Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - "engine/**"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "music-studio.html"
      - "worker.js"
      - "scripts/**"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    name: JavaScript, HTML, and Worker smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run syntax checks
        run: python scripts/quality-check.py

      - name: Run Worker smoke tests
        run: node --test scripts/worker-smoke.test.mjs

      - name: Run local Music Studio control-plane tests
        run: python -m unittest discover -s engine -p 'test_*.py' -v
