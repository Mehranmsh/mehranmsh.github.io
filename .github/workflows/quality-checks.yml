name: MEHRAN MSH Quality Checks
# Run Worker, Intelligence, migration-schema, and local regression contracts.

on:
  push:
    branches:
      - main
      - intelligence/integrated-knowledge-approval-staging-v1
    paths:
      - "index.html"
      - "intelligence-staging.html"
      - "music-studio.html"
      - "worker.js"
      - "intelligence-staging-worker.js"
      - "intelligence-capability-policy.mjs"
      - "intelligence-review-queue.mjs"
      - "intelligence-approval-input.mjs"
      - "wrangler.intelligence-staging.jsonc"
      - "migrations/000*.sql"
      - "docs/INTELLIGENCE-*.md"
      - "scripts/**"
      - "engine/**"
      - "instrument-sampler.js"
      - "assets/instruments/**"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "index.html"
      - "intelligence-staging.html"
      - "music-studio.html"
      - "worker.js"
      - "intelligence-staging-worker.js"
      - "intelligence-approval-input.mjs"
      - "wrangler.intelligence-staging.jsonc"
      - "migrations/000*.sql"
      - "docs/INTELLIGENCE-*.md"
      - "scripts/**"
      - "engine/**"
      - "instrument-sampler.js"
      - "assets/instruments/**"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    name: JavaScript, HTML, and Worker smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run syntax checks
        run: python scripts/quality-check.py

      - name: Run Worker smoke tests
        run: node --test scripts/worker-smoke.test.mjs

      - name: Test deterministic Intelligence review queue prioritization
        run: node --test scripts/intelligence-review-queue.test.mjs

      - name: Test INTELLIGENCE capability policy and autonomy boundaries
        run: node --test scripts/intelligence-capability-policy.test.mjs

      - name: Test strict approval lifetime input behavior
        run: node --test scripts/intelligence-approval-input.test.mjs

      - name: Test one-time capability approval consumption atomicity
        run: python scripts/test-intelligence-capability-approval-atomic-consumption.py

      - name: Execute D1 migration schema contract in disposable SQLite
        run: python scripts/test-intelligence-approval-migration.py

      - name: Test complete Intelligence staging migration chain in disposable SQLite
        run: python scripts/test-intelligence-staging-schema.py

      - name: Test owner-memory confidence integer database guard
        run: python scripts/test-intelligence-owner-memory-confidence.py

      - name: Test isolated Intelligence staging Worker security contract
        run: python scripts/test-intelligence-staging-worker.py

      - name: Test isolated Intelligence staging UI safety contract
        run: python scripts/test-intelligence-staging-ui.py

      - name: Test Intelligence knowledge and memory owner isolation in disposable SQLite
        run: python scripts/test-intelligence-knowledge-isolation.py

      - name: Test Intelligence knowledge relationship migration in disposable SQLite
        run: python scripts/test-intelligence-knowledge-relations.py

      - name: Run local Music Studio control-plane tests
        run: python -m unittest discover -s engine -p 'test_*.py' -v
