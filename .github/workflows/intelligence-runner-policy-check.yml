name: MEHRAN INTELLIGENCE runner policy validation

on:
  push:
    branches:
      - intelligence/safe-runner-hardening
    paths:
      - ".github/workflows/mehran-intelligence-runner.yml"
      - ".github/workflows/intelligence-runner-policy-check.yml"

permissions:
  contents: read

jobs:
  validate-runner-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify runner safeguards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";

          const source = readFileSync(".github/workflows/mehran-intelligence-runner.yml", "utf8");
          assert.ok(source.includes('cron: "*/15 * * * *"'), "15-minute polling must be configured");
          assert.equal(source.includes('cron: "*/5 * * * *"'), false, "five-minute polling must remain disabled");

          for (const key of [
            "mehran-intelligence-repo-inspection-v2-",
            "mehran-intelligence-self-improvement-v3-",
            "mehran-intelligence-fixed-tests-v2-"
          ]) {
            assert.equal(source.includes(key), false, "automatic package seeding remains: " + key);
          }

          assert.ok(source.includes('request("/agent/v1/tasks/next")'),
            "runner must continue processing explicitly queued tasks");
          const prJob = source.slice(source.indexOf("  create-review-pr-from-verified-patch:"));
          assert.ok(prJob.startsWith("  create-review-pr-from-verified-patch:"), "PR job must remain inspectable");
          assert.ok(prJob.includes("if: false # Owner-approved manual review is required; automated PR creation is disabled."),
            "automated proposal PR creation must be disabled");
          assert.ok(prJob.includes("scripts/intelligence-proposal-pr-runner.mjs"), "disabled PR job target must remain identifiable");
          assert.ok(source.split("jobs:")[0].includes("contents: read"), "workflow permissions must remain read-only");
          console.log("PASS: 15-minute polling, no automatic seed packages, approved-queue processing, PR automation disabled, read-only workflow permissions.");
          NODE
