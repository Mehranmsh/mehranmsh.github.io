name: MEHRAN Concert Harp Source Inspection

on:
  push:
    branches:
      - feature/mehran-independent-music-core
    paths:
      - '.github/workflows/concert-harp-source-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-pinned-freepats-harp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official CC0 Concert Harp archive
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import tarfile
          import urllib.request

          url = "https://freepats.zenvoid.org/OrchestralStrings/ConcertHarp/ConcertHarp-SFZ-20200702.tar.xz"
          request = urllib.request.Request(url, headers={"User-Agent": "MEHRAN-Music-Engine/1.0"})
          with urllib.request.urlopen(request, timeout=90) as response:
              archive = response.read()
          print("ARCHIVE_BYTES", len(archive))
          print("ARCHIVE_SHA256", hashlib.sha256(archive).hexdigest())
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as bundle:
              members = bundle.getmembers()
              print("ARCHIVE_MEMBER_COUNT", len(members))
              for item in members[:120]:
                  print("MEMBER", item.name, item.size, "file" if item.isfile() else "dir")
              sfz_files = [item for item in members if item.isfile() and item.name.lower().endswith(".sfz")]
              if not sfz_files:
                  raise SystemExit("No SFZ file found in official harp archive")
              for item in sfz_files:
                  stream = bundle.extractfile(item)
                  if stream is None:
                      raise SystemExit(f"Could not read SFZ: {item.name}")
                  text = stream.read().decode("utf-8-sig")
                  print("SFZ_FILE", item.name)
                  print("SFZ_TEXT_BEGIN")
                  print(text[:30000])
                  print("SFZ_TEXT_END")
          PY
