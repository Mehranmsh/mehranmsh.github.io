name: MEHRAN INTELLIGENCE Independent Recovery Supervisor

on:
  workflow_run:
    workflows:
      - "MEHRAN INTELLIGENCE private work-package runner"
    types:
      - completed

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: mehran-intelligence-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover-runner:
    if: >-
      github.event.workflow_run.name == 'MEHRAN INTELLIGENCE private work-package runner'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retry one failed runner attempt or escalate repeated failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = "[MEHRAN ALERT] Independent recovery required";
            const issues = github.rest.issues;

            if (!run || !Number.isInteger(run.id) ||
                run.name !== "MEHRAN INTELLIGENCE private work-package runner") {
              core.setFailed("Recovery supervisor received an unexpected workflow event.");
              return;
            }

            const existing = await issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100
            });
            let alert = existing.data.find(item =>
              !item.pull_request && item.title === title
            );

            if (run.conclusion === "success") {
              if (alert) {
                await issues.createComment({
                  ...context.repo,
                  issue_number: alert.number,
                  body: [
                    "RECOVERED: the private work-package runner completed successfully.",
                    "",
                    `- Run: ${run.html_url}`,
                    `- Attempt: ${run.run_attempt}`,
                    `- Commit: ${String(run.head_sha || "").slice(0, 12)}`
                  ].join("\n")
                });
                await issues.update({
                  ...context.repo,
                  issue_number: alert.number,
                  state: "closed"
                });
              }
              core.info("Runner completed successfully; no recovery action is needed.");
              return;
            }

            if (run.conclusion !== "failure") {
              core.info(`Runner conclusion was ${String(run.conclusion)}; no automatic retry was attempted.`);
              return;
            }

            const runUrl = run.html_url;
            const attempt = Number(run.run_attempt || 1);

            if (attempt < 2) {
              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  }
                );
                core.notice(`Independent supervisor requested the single permitted retry for run ${run.id}.`);
                return;
              } catch (error) {
                core.warning("The bounded retry request failed; escalating to the owner.");
              }
            }

            const body = [
              "## Independent recovery could not restore the runner",
              "",
              `- Workflow: ${run.name}`,
              `- Conclusion: ${run.conclusion}`,
              `- Attempt: ${attempt}`,
              `- Branch: ${run.head_branch || "unknown"}`,
              `- Commit: ${String(run.head_sha || "").slice(0, 12)}`,
              `- Failed run: ${runUrl}`,
              `- Detected: ${new Date().toISOString()}`,
              "",
              "The independent supervisor permits at most one automatic retry. Repeated failure is escalated instead of entering an infinite loop.",
              "No source files, production state, secrets, wallet data, or user records were accessed or changed.",
              "A code repair, merge, or deployment is not performed by this supervisor."
            ].join("\n");

            if (alert) {
              await issues.update({
                ...context.repo,
                issue_number: alert.number,
                body
              });
            } else {
              await issues.create({
                ...context.repo,
                title,
                body
              });
            }
            core.setFailed("Runner failed after its bounded recovery opportunity; owner attention is required.");
