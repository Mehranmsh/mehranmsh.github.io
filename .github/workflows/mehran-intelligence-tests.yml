name: MEHRAN INTELLIGENCE isolated repository tests

run-name: "MEHRAN INTELLIGENCE isolated tests @ ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.base_sha || github.sha }}"

on:
  push:
    branches: ["intelligence/**"]
    paths:
      - "worker.js"
      - "scripts/**"
      - ".github/workflows/mehran-intelligence-runner.yml"
      - ".github/workflows/mehran-intelligence-tests.yml"
      - "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
  pull_request:
    branches: [main]
    paths:
      - "worker.js"
      - "scripts/**"
      - ".github/workflows/mehran-intelligence-runner.yml"
      - ".github/workflows/mehran-intelligence-tests.yml"
      - "docs/INTELLIGENCE_EXECUTION_PROTOCOL.md"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact 40-character main-branch commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mehran-intelligence-isolated-tests-${{ github.event.pull_request.head.sha || inputs.base_sha || github.sha }}
  cancel-in-progress: false

jobs:
  fixed-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact requested commit without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit identity and main-branch ancestry
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.base_sha || github.sha }}
          EXPECTED_PR_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Rejected: selected commit must be a lowercase 40-character SHA."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$BASE_SHA" = "$EXPECTED_PR_SHA"
            echo "Verified exact pull-request head commit $BASE_SHA."
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git merge-base --is-ancestor "$BASE_SHA" origin/main
            echo "Verified immutable commit $BASE_SHA is an ancestor of origin/main."
          else
            test "$BASE_SHA" = "$EVENT_SHA"
            echo "Verified exact Intelligence branch push commit $BASE_SHA."
          fi

      - name: Run the one fixed policy test in a network-isolated container
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 768m \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --workdir /workspace \
            node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a \
            sh -c 'node --check worker.js && node --check scripts/intelligence-capabilities.mjs && node --test scripts/intelligence-capabilities.test.mjs'
