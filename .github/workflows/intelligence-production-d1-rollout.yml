name: MEHRAN INTELLIGENCE Production D1 Rollout

on:
  pull_request:
    paths:
      - "scripts/intelligence-production-d1-check.mjs"
      - "scripts/test-intelligence-production-rollout-workflow.mjs"
      - ".github/workflows/intelligence-production-d1-rollout.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose a read-only preflight or one migration step"
        required: true
        type: choice
        options:
          - preflight-0001
          - apply-0001
          - preflight-0002
          - apply-0002
      confirmation:
        description: "For apply only, type the exact production confirmation phrase"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mehran-intelligence-production-d1-rollout
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate rollout checker syntax
        run: node --check scripts/intelligence-production-d1-check.mjs
      - name: Validate safe workflow input handling
        run: node scripts/test-intelligence-production-rollout-workflow.mjs

  rollout:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected rollout branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/intelligence/production-compatible-v1" || {
            echo "Run this workflow only from intelligence/production-compatible-v1."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required Cloudflare credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }

      - name: Read-only schema preflight
        if: inputs.action == 'preflight-0001' || inputs.action == 'preflight-0002' || inputs.action == 'apply-0001' || inputs.action == 'apply-0002'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: "2ee71f12-042b-4dba-8bf0-a0b577ace519"
          ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_ACTION" = "preflight-0001" ] || [ "$ROLLOUT_ACTION" = "apply-0001" ]; then
            node scripts/intelligence-production-d1-check.mjs preflight-0001
          else
            node scripts/intelligence-production-d1-check.mjs preflight-0002
          fi

      - name: Apply migration 0001 to production D1
        if: inputs.action == 'apply-0001'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ROLLOUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_CONFIRMATION" != "APPLY-INTELLIGENCE-0001-TO-PRODUCTION" ]; then
            echo "Exact confirmation phrase missing. No migration executed."
            exit 1
          fi
          npx --yes wrangler@4 d1 execute mehran-msh-db --remote --file=migrations/production/0001_intelligence_owner_projects.sql
          node scripts/intelligence-production-d1-check.mjs verify-0001

      - name: Apply migration 0002 to production D1
        if: inputs.action == 'apply-0002'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ROLLOUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_CONFIRMATION" != "APPLY-INTELLIGENCE-0002-TO-PRODUCTION" ]; then
            echo "Exact confirmation phrase missing. No migration executed."
            exit 1
          fi
          npx --yes wrangler@4 d1 execute mehran-msh-db --remote --file=migrations/production/0002_intelligence_knowledge_memory.sql
          node scripts/intelligence-production-d1-check.mjs verify-0002

      - name: Run read-only selected preflight
        if: inputs.action == 'preflight-0001' || inputs.action == 'preflight-0002'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: "2ee71f12-042b-4dba-8bf0-a0b577ace519"
          ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          node scripts/intelligence-production-d1-check.mjs "$ROLLOUT_ACTION"
