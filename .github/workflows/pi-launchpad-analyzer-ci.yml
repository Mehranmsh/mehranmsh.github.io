name: Pi Launchpad Analyzer isolated tests

on:
  push:
    branches:
      - intelligence/pi-launchpad-analyzer-mvp
    paths:
      - "scripts/pi-launchpad-analyzer.mjs"
      - "scripts/pi-launchpad-analyzer.test.mjs"
      - "scripts/pi-launchpad-data-adapter.mjs"
      - "scripts/pi-launchpad-data-adapter.test.mjs"
      - "scripts/pi-launchpad-attestation-verifier.mjs"
      - "scripts/pi-launchpad-attestation-verifier.test.mjs"
      - "scripts/pi-launchpad-evidence-gateway.mjs"
      - "scripts/pi-launchpad-evidence-gateway.test.mjs"
      - "scripts/pi-launchpad-metrics-gateway.mjs"
      - "scripts/pi-launchpad-metrics-gateway.test.mjs"
      - "scripts/pi-launchpad-verified-analyzer.mjs"
      - "scripts/pi-launchpad-verified-analyzer.test.mjs"
      - "scripts/pi-launchpad-verified-analyzer-metrics.test.mjs"
      - "scripts/pi-launchpad-trust-store.mjs"
      - "scripts/pi-launchpad-trust-store.test.mjs"
      - "scripts/pi-launchpad-source-registry.mjs"
      - "scripts/pi-launchpad-source-registry.test.mjs"
      - "scripts/pi-launchpad-connector-policy.mjs"
      - "scripts/pi-launchpad-connector-policy.test.mjs"
      - "scripts/pi-launchpad-snapshot-monitor.mjs"
      - "scripts/pi-launchpad-snapshot-monitor.test.mjs"
      - "scripts/pi-launchpad-portfolio-ranker.mjs"
      - "scripts/pi-launchpad-portfolio-ranker.test.mjs"
      - "scripts/pi-launchpad-batch-screen.mjs"
      - "scripts/pi-launchpad-batch-screen.test.mjs"
      - ".github/workflows/pi-launchpad-analyzer-ci.yml"

permissions:
  contents: read

concurrency:
  group: pi-launchpad-analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify analyzer syntax
        run: |
          node --check scripts/pi-launchpad-analyzer.mjs
          node --check scripts/pi-launchpad-evidence-gateway.mjs
          node --check scripts/pi-launchpad-metrics-gateway.mjs
          node --check scripts/pi-launchpad-verified-analyzer.mjs
      - name: Run analyzer tests
        run: node --test --test-reporter=tap scripts/pi-launchpad-*.test.mjs
