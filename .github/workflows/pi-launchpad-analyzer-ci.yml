name: Pi Launchpad Analyzer isolated tests

on:
  push:
    branches:
      - intelligence/pi-launchpad-analyzer-mvp
      - feat/launchpad-mainnet-readiness-gate
    paths:
      - "scripts/pi-launchpad-analyzer.mjs"
      - "scripts/pi-launchpad-analyzer.test.mjs"
      - "scripts/pi-launchpad-data-adapter.mjs"
      - "scripts/pi-launchpad-data-adapter.test.mjs"
      - "scripts/pi-launchpad-attestation-verifier.mjs"
      - "scripts/pi-launchpad-attestation-verifier.test.mjs"
      - "scripts/pi-launchpad-evidence-gateway.mjs"
      - "scripts/pi-launchpad-evidence-gateway.test.mjs"
      - "scripts/pi-launchpad-metrics-gateway.mjs"
      - "scripts/pi-launchpad-metrics-gateway.test.mjs"
      - "scripts/pi-launchpad-verified-analyzer.mjs"
      - "scripts/pi-launchpad-verified-analyzer.test.mjs"
      - "scripts/pi-launchpad-verified-analyzer-metrics.test.mjs"
      - "scripts/pi-testnet-rpc-policy.mjs"
      - "scripts/pi-testnet-rpc-policy.test.mjs"
      - "scripts/pi-testnet-observation-archive.mjs"
      - "scripts/pi-testnet-observation-archive.test.mjs"
      - "scripts/pi-testnet-observation-storage-policy.mjs"
      - "scripts/pi-testnet-observation-storage-policy.test.mjs"
      - "scripts/pi-testnet-observation-memory-repository.mjs"
      - "scripts/pi-testnet-observation-memory-repository.test.mjs"
      - "scripts/pi-testnet-observation-encryption.mjs"
      - "scripts/pi-testnet-observation-encryption.test.mjs"
      - "scripts/pi-testnet-observation-keyring.mjs"
      - "scripts/pi-testnet-observation-keyring.test.mjs"
      - "scripts/pi-testnet-observation-rotation.mjs"
      - "scripts/pi-testnet-observation-rotation.test.mjs"
      - "scripts/pi-testnet-observation-replacement-intent.mjs"
      - "scripts/pi-testnet-observation-replacement-intent.test.mjs"
      - "scripts/pi-testnet-observation-replacement-journal.mjs"
      - "scripts/pi-testnet-observation-replacement-journal.test.mjs"
      - "scripts/pi-testnet-observation-recovery-gate.mjs"
      - "scripts/pi-testnet-observation-recovery-gate.test.mjs"
      - "scripts/pi-testnet-observation-transaction.mjs"
      - "scripts/pi-testnet-observation-transaction.test.mjs"
      - "scripts/pi-testnet-observation-d1-batch.mjs"
      - "scripts/pi-testnet-observation-d1-batch.test.mjs"
      - "scripts/sql/pi-testnet-observation-d1-schema.sql"
      - "scripts/sql/test_pi_testnet_observation_d1_schema.py"
      - "scripts/pi-launchpad-trust-store.mjs"
      - "scripts/pi-launchpad-trust-store.test.mjs"
      - "scripts/pi-launchpad-source-registry.mjs"
      - "scripts/pi-launchpad-source-registry.test.mjs"
      - "scripts/pi-launchpad-connector-policy.mjs"
      - "scripts/pi-launchpad-connector-policy.test.mjs"
      - "scripts/pi-launchpad-mainnet-readiness.mjs"
      - "scripts/pi-launchpad-mainnet-readiness.test.mjs"
      - "scripts/pi-launchpad-snapshot-monitor.mjs"
      - "scripts/pi-launchpad-snapshot-monitor.test.mjs"
      - "scripts/pi-launchpad-portfolio-ranker.mjs"
      - "scripts/pi-launchpad-portfolio-ranker.test.mjs"
      - "scripts/pi-launchpad-batch-screen.mjs"
      - "scripts/pi-launchpad-batch-screen.test.mjs"
      - ".github/workflows/pi-launchpad-analyzer-ci.yml"

permissions:
  contents: read

concurrency:
  group: pi-launchpad-analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify analyzer syntax
        run: |
          node --check scripts/pi-launchpad-analyzer.mjs
          node --check scripts/pi-launchpad-evidence-gateway.mjs
          node --check scripts/pi-launchpad-metrics-gateway.mjs
          node --check scripts/pi-launchpad-verified-analyzer.mjs
          node --check scripts/pi-testnet-rpc-policy.mjs
          node --check scripts/pi-testnet-observation-archive.mjs
          node --check scripts/pi-testnet-observation-storage-policy.mjs
          node --check scripts/pi-testnet-observation-memory-repository.mjs
          node --check scripts/pi-testnet-observation-encryption.mjs
          node --check scripts/pi-testnet-observation-keyring.mjs
          node --check scripts/pi-testnet-observation-rotation.mjs
          node --check scripts/pi-testnet-observation-replacement-intent.mjs
          node --check scripts/pi-testnet-observation-replacement-journal.mjs
          node --check scripts/pi-testnet-observation-recovery-gate.mjs
          node --check scripts/pi-testnet-observation-transaction.mjs
          node --check scripts/pi-testnet-observation-d1-batch.mjs
      - name: Run analyzer tests
        run: node --test --test-reporter=tap scripts/pi-launchpad-*.test.mjs scripts/pi-testnet-*.test.mjs
      - name: Run D1 schema SQLite compatibility tests
        run: python3 -m unittest scripts/sql/test_pi_testnet_observation_d1_schema.py
