name: MEHRAN SVS neural architecture tests

on:
  push:
    branches: [main]
    paths:
      - "ai-singer/model_architecture.py"
      - "ai-singer/training-requirements.txt"
      - "ai-singer/tests/test_model_architecture.py"
      - ".github/workflows/ai-singer-model-tests.yml"
  pull_request:
    paths:
      - "ai-singer/model_architecture.py"
      - "ai-singer/training-requirements.txt"
      - "ai-singer/tests/test_model_architecture.py"
      - ".github/workflows/ai-singer-model-tests.yml"
  workflow_dispatch:

jobs:
  neural-forward-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-singer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-singer/requirements.txt
            ai-singer/training-requirements.txt
      - name: Install API and model test dependencies
        run: |
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu -r training-requirements.txt
      - name: Run neural architecture forward and gradient tests
        run: python -m unittest tests.test_model_architecture -v
