name: MEHRAN SVS neural architecture tests

on:
  push:
    branches: [main]
    paths:
      - "ai-singer/quality_evaluation.py"
      - "ai-singer/quality_report.py"
      - "ai-singer/heldout_evaluation.py"
      - "ai-singer/model_comparison.py"
      - "ai-singer/listening_review.py"
      - "ai-singer/tests/test_listening_review.py"
      - "ai-singer/tests/test_model_comparison.py"
      - "ai-singer/tests/test_heldout_evaluation.py"
      - "ai-singer/tests/test_quality_report.py"
      - "ai-singer/tests/test_quality_evaluation.py"
      - "ai-singer/dataset_audit.py"
      - "ai-singer/dataset_manifest.py"
      - "ai-singer/tests/test_dataset_manifest.py"
      - "ai-singer/tests/test_dataset_audit.py"
      - "ai-singer/pipeline_training_engine.py"
      - "ai-singer/train_singing_pipeline.py"
      - "ai-singer/inference_runtime.py"
      - "ai-singer/joint_model_bundle.py"
      - "ai-singer/tests/test_joint_model_bundle.py"
      - "ai-singer/tests/test_pipeline_training_engine.py"
      - "ai-singer/tests/test_train_singing_pipeline.py"
      - "ai-singer/tests/test_inference_runtime.py"
      - "ai-singer/model_architecture.py"
      - "ai-singer/waveform_decoder.py"
      - "ai-singer/waveform_losses.py"
      - "ai-singer/waveform_training_engine.py"
      - "ai-singer/train_waveform_decoder.py"
      - "ai-singer/singing_pipeline.py"
      - "ai-singer/waveform_output.py"
      - "ai-singer/model_bundle.py"
      - "ai-singer/tests/test_model_bundle.py"
      - "ai-singer/tests/test_waveform_output.py"
      - "ai-singer/tests/test_singing_pipeline.py"
      - "ai-singer/tests/test_train_waveform_decoder.py"
      - "ai-singer/tests/test_waveform_training_engine.py"
      - "ai-singer/tests/test_waveform_losses.py"
      - "ai-singer/tests/test_waveform_decoder.py"
      - "ai-singer/speaker_encoder.py"
      - "ai-singer/speaker_reference.py"
      - "ai-singer/tests/test_speaker_reference.py"
      - "ai-singer/tests/test_speaker_encoder.py"
      - "ai-singer/training_engine.py"
      - "ai-singer/train_model.py"
      - "ai-singer/training-requirements.txt"
      - "ai-singer/tests/test_model_architecture.py"
      - "ai-singer/tests/test_training_engine.py"
      - "ai-singer/tests/test_train_model.py"
      - ".github/workflows/ai-singer-model-tests.yml"
  pull_request:
    paths:
      - "ai-singer/quality_evaluation.py"
      - "ai-singer/quality_report.py"
      - "ai-singer/heldout_evaluation.py"
      - "ai-singer/model_comparison.py"
      - "ai-singer/dataset_manifest.py"
      - "ai-singer/tests/test_dataset_manifest.py"
      - "ai-singer/listening_review.py"
      - "ai-singer/tests/test_listening_review.py"
      - "ai-singer/tests/test_model_comparison.py"
      - "ai-singer/tests/test_heldout_evaluation.py"
      - "ai-singer/tests/test_quality_report.py"
      - "ai-singer/tests/test_quality_evaluation.py"
      - "ai-singer/model_architecture.py"
      - "ai-singer/training-requirements.txt"
      - "ai-singer/tests/test_model_architecture.py"
      - ".github/workflows/ai-singer-model-tests.yml"
  workflow_dispatch:

jobs:
  neural-forward-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-singer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-singer/requirements.txt
            ai-singer/training-requirements.txt
      - name: Install API and model test dependencies
        run: |
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu -r training-requirements.txt
      - name: Run leakage-safe speaker reference pairing tests
        run: python -m unittest discover -s tests -p 'test_speaker_reference.py' -v
      - name: Run reference speaker encoder tests
        run: python -m unittest discover -s tests -p 'test_speaker_encoder.py' -v
      - name: Run neural waveform decoder tests
        run: python -m unittest discover -s tests -p 'test_waveform_decoder.py' -v
      - name: Run waveform reconstruction loss tests
        run: python -m unittest discover -s tests -p 'test_waveform_losses.py' -v
      - name: Run waveform decoder training tests
        run: python -m unittest discover -s tests -p 'test_waveform_training_engine.py' -v
      - name: Run waveform decoder CLI tests
        run: python -m unittest discover -s tests -p 'test_train_waveform_decoder.py' -v
      - name: Run end-to-end singing pipeline tests
        run: python -m unittest discover -s tests -p 'test_singing_pipeline.py' -v
      - name: Run joint pipeline training engine tests
        run: python -m unittest discover -s tests -p 'test_pipeline_training_engine.py' -v
      - name: Run joint pipeline trainer CLI tests
        run: python -m unittest discover -s tests -p 'test_train_singing_pipeline.py' -v
      - name: Run guarded local inference runtime tests
        run: python -m unittest discover -s tests -p 'test_inference_runtime.py' -v
      - name: Run joint model bundle integrity tests
        run: python -m unittest discover -s tests -p 'test_joint_model_bundle.py' -v
      - name: Run objective singing quality evaluation tests
        run: python -m unittest discover -s tests -p 'test_quality_evaluation.py' -v
      - name: Run aggregate quality report tests
        run: python -m unittest discover -s tests -p 'test_quality_report.py' -v
      - name: Run held-out inference evaluation tests
        run: python -m unittest discover -s tests -p 'test_heldout_evaluation.py' -v
      - name: Run same-split model comparison tests
        run: python -m unittest discover -s tests -p 'test_model_comparison.py' -v
      - name: Run offline blind listening review tests
        run: python -m unittest discover -s tests -p 'test_listening_review.py' -v
      - name: Run verified waveform output tests
        run: python -m unittest discover -s tests -p 'test_waveform_output.py' -v
      - name: Run model bundle integrity tests
        run: python -m unittest discover -s tests -p 'test_model_bundle.py' -v
      - name: Run neural architecture forward and gradient tests
        run: python -m unittest discover -s tests -p 'test_model_architecture.py' -v
      - name: Run masked training and checkpoint tests
        run: python -m unittest discover -s tests -p 'test_training_engine.py' -v
      - name: Run local training CLI preparation tests
        run: python -m unittest discover -s tests -p 'test_train_model.py' -v
