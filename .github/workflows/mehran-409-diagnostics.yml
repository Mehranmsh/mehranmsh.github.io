name: MEHRAN INTELLIGENCE read-only 409 diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mehran-409-diagnostics.yml"
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mehran-409-readonly-diagnostics
  cancel-in-progress: false

jobs:
  inspect-production:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read aggregate work-package and generator-lock diagnostics
        env:
          MEHRAN_ORCHESTRATOR_TOKEN: ${{ secrets.MEHRAN_ORCHESTRATOR_TOKEN }}
          MEHRAN_AGENT_URL: https://mehran-msh-auth.mehran79mehran.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.MEHRAN_AGENT_URL;
          const token = process.env.MEHRAN_ORCHESTRATOR_TOKEN || "";
          if (!base || token.length < 40 || token.length > 200) {
            throw new Error("Orchestrator credential is missing or invalid.");
          }
          const response = await fetch(base + "/agent/v1/work-packages/scope-diagnostics", {
            method: "GET",
            headers: {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            },
            signal: AbortSignal.timeout(20000)
          });
          const raw = await response.text();
          if (raw.length > 20000) throw new Error("Diagnostics response exceeded the safe limit.");
          let data;
          try { data = JSON.parse(raw); }
          catch { throw new Error("Diagnostics endpoint returned non-JSON HTTP " + response.status); }
          if (!response.ok || data.success !== true || data.readOnly !== true || data.aggregateOnly !== true) {
            throw new Error("Read-only production diagnostics failed; HTTP " + response.status);
          }
          const report = {
            readOnly: data.readOnly,
            aggregateOnly: data.aggregateOnly,
            packages: data.packages,
            taskLedger: data.taskLedger,
            generatorLock: data.generatorLock
          };
          console.log("[production-409-diagnostics] " + JSON.stringify(report));
          if (data.packages?.blockerCount > 0 || data.generatorLock?.leaseActive === true) {
            console.log("RESULT: production still reports at least one active blocker or generator lease.");
          } else {
            console.log("RESULT: no active blocker or generator lease is reported by diagnostics.");
          }
          NODE
