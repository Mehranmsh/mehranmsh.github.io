name: Full CC0 Meta Guitar Banks

on:
  push:
    branches:
      - feature/mehran-independent-music-core
    paths:
      - 'engine/fetch_meta_guitar_banks.py'
      - 'engine/test_fetch_meta_guitar_banks.py'
      - 'engine/sample_bank.py'
      - 'engine/sample_renderer.py'
      - 'engine/sample_bank_install.py'
      - 'engine/test_sample_bank_install.py'
      - 'engine/guitar_string_planner.py'
      - 'engine/fetch_meta_piano_bank.py'
      - 'engine/test_fetch_meta_piano_bank.py'
      - 'engine/mehran_music_core.py'
      - 'engine/velocity_layer_planner.py'
      - '.github/workflows/meta-guitar-banks.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: engine

jobs:
  build-guitar-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout MEHRAN engine
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test SFZ guitar maps and checksum parser
        run: python3 -m unittest engine.test_fetch_meta_guitar_banks -v
      - name: Test safe recorded-bank installation and provenance
        run: python3 -m unittest engine.test_sample_bank_install -v
      - name: Download, verify, convert, and validate nylon guitar
        timeout-minutes: 20
        run: python3 engine/fetch_meta_guitar_banks.py meta-nylon-guitar sample-bank-meta-nylon-guitar
      - name: Download, verify, convert, and validate steel guitar
        timeout-minutes: 20
        run: python3 engine/fetch_meta_guitar_banks.py meta-steel-guitar sample-bank-meta-steel-guitar
      - name: Render real guitar audition notes
        run: |
          python3 - <<'PY'
          import wave
          from sample_bank import load_sample_bank
          from sample_renderer import render_sample_events

          cases = [
              ('sample-bank-meta-nylon-guitar', 'nylon_guitar', 'finger', 40, 64, 'nylon-E2-finger.wav'),
              ('sample-bank-meta-nylon-guitar', 'nylon_guitar', 'pick', 40, 64, 'nylon-E2-pick-crossfade.wav'),
              ('sample-bank-meta-steel-guitar', 'acoustic_guitar', 'sustain', 40, 70, 'steel-E2.wav'),
          ]
          for root, instrument, articulation, note, velocity, filename in cases:
              bank = load_sample_bank(root)
              output = f'{root}/{filename}'
              report = render_sample_events([{
                  'instrument': instrument,
                  'midi_note': note,
                  'start_seconds': 0,
                  'duration_seconds': 0.8,
                  'velocity': velocity,
                  'articulation': articulation,
                  'guitar_string': 'LowE',
              }], bank, output, sample_rate=44100)
              assert report['events_rendered'] == 1, report
              assert report['guitar_string_selections'][0]['string'] == 'LowE', report
              if articulation == 'pick':
                  assert report['sample_selection']['equal_power_velocity_crossfade_events'] == 1, report
                  assert report['sample_selection']['velocity_layers_rendered'] == 2, report
              with wave.open(output, 'rb') as audio:
                  assert audio.getnchannels() == 2
                  assert audio.getsampwidth() == 2
                  assert any(audio.readframes(audio.getnframes())), filename
              print('REAL_GUITAR_PREVIEW_OK', filename, report['sample_selection'])
          PY
      - name: Download and verify the full CC0 piano bank
        timeout-minutes: 20
        run: python3 engine/fetch_meta_piano_bank.py sample-bank-meta-piano
      - name: Install all three real banks and render a piano plus guitar composition
        timeout-minutes: 15
        run: |
          python3 engine/sample_bank_install.py sample-bank-installed-all sample-bank-meta-nylon-guitar sample-bank-meta-steel-guitar sample-bank-meta-piano
          python3 - <<'PY'
          import wave
          from mehran_music_core import compose_plan
          from sample_bank import load_sample_bank
          from sample_renderer import build_composition_events, render_sample_events

          lyrics = "برگرد ای عشق، کنار من بمان\nدر این شب سرد، چراغ خانه‌مان"
          plan = compose_plan(lyrics, title="MEHRAN Piano Guitar Test", genre="pop", target_bpm=84)
          for phrase in plan["composition"]["melody"]:
              for item in phrase.get("note_lyric_map", []):
                  if isinstance(item, dict):
                      item["articulation"] = "sustain"
          bank = load_sample_bank("sample-bank-installed-all")
          assert len(bank.samples) >= 352 + 348 + 375, len(bank.samples)
          available = {sample.instrument for sample in bank.samples}
          assert {"piano", "nylon_guitar", "acoustic_guitar"} <= available, available
          events = build_composition_events(
              plan,
              instruments={"guitar": "acoustic_guitar"},
              response_fill_part=None,
          )
          # Render a short, real-recording preview rather than the entire generated
          # arrangement in the CI runner. This keeps the verification bounded while
          # preserving all three musical parts in the same audible passage.
          preview_seconds = 8.0
          selected = [
              dict(event) for event in events
              if event.get("part") in {"melody", "chords", "guitar"}
              and event.get("start_seconds", 0) < preview_seconds
          ]
          for event in selected:
              remaining = preview_seconds - event["start_seconds"]
              event["duration_seconds"] = min(event["duration_seconds"], remaining, 0.65)
          selected = [event for event in selected if event["duration_seconds"] > 0]
          assert selected, "No piano/guitar composition events were planned in the preview window"
          selected_parts = {event.get("part") for event in selected}
          selected_instruments = {event.get("instrument") for event in selected}
          assert {"melody", "chords", "guitar"} <= selected_parts, selected_parts
          assert {"piano", "acoustic_guitar"} <= selected_instruments, selected_instruments
          for event in selected:
              if event.get("part") == "guitar":
                  event["guitar_max_fret"] = 12
          output = "sample-bank-installed-all/mehran-piano-guitar-composition.wav"
          report = render_sample_events(selected, bank, output, sample_rate=44100)
          assert report["events_rendered"] == len(selected), report
          assert report["source"] == "recorded_sample_bank", report
          assert report["guitar_string_selections"], "No real guitar strings were selected"
          with wave.open(output, "rb") as audio:
              assert audio.getnchannels() == 2
              assert audio.getsampwidth() == 2
              assert audio.getframerate() == 44100
              assert audio.getnframes() > 44100
              pcm = audio.readframes(audio.getnframes())
          assert any(pcm), "Combined piano/guitar WAV is silent"
          import array
          samples_pcm = array.array("h")
          samples_pcm.frombytes(pcm)
          peak = max(abs(value) for value in samples_pcm)
          rms = (sum(value * value for value in samples_pcm) / len(samples_pcm)) ** 0.5
          assert peak > 100, f"Combined WAV peak is unexpectedly quiet: {peak}"
          assert rms > 10, f"Combined WAV RMS is unexpectedly quiet: {rms}"
          assert report["peak_after_normalization"] > 0, report
          assert report["clipping_samples"] == 0, report
          print("REAL_RECORDED_PIANO_GUITAR_COMPOSITION_OK", {
              "samples": len(bank.samples),
              "parts": sorted(selected_parts),
              "instruments": sorted(selected_instruments),
              "events": report["events_rendered"],
              "duration": report["duration_seconds"],
              "guitar_strings": len(report["guitar_string_selections"]),
              "peak": peak,
              "rms": round(rms, 2),
              "sample_selection": report["sample_selection"],
          })
          PY
      - name: Publish verified guitar banks and audition WAVs
        uses: actions/upload-artifact@v4
        with:
          name: mehran-cc0-real-nylon-and-steel-guitar-banks
          path: |
            sample-bank-meta-nylon-guitar/
            sample-bank-meta-steel-guitar/
            sample-bank-meta-piano/
            sample-bank-installed-all/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
