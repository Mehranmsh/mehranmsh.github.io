name: MEHRAN VSCO2 CC0 Concert Flute
on:
  push:
    branches: [feature/mehran-independent-music-core]
    paths: ['engine/fetch_vsco2_flute.py','engine/test_fetch_vsco2_flute.py','engine/sample_bank.py','engine/sample_renderer.py','.github/workflows/vsco2-flute-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: engine
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest engine.test_fetch_vsco2_flute engine.test_sample_bank -v
      - run: python3 engine/fetch_vsco2_flute.py sample-bank-vsco2-flute
      - name: Render recorded audition
        run: |
          python3 - <<'PY'
          import wave
          from sample_bank import load_sample_bank
          from sample_renderer import render_sample_events
          bank=load_sample_bank('sample-bank-vsco2-flute')
          notes=[48,52,55,60,64,67,72,76,79,84]
          events=[{'instrument':'concert_flute','midi_note':n,'start_seconds':i*.55,'duration_seconds':.45,'velocity':96,'articulation':'sustain_vibrato'} for i,n in enumerate(notes)]
          events += [{'instrument':'concert_flute','midi_note':n,'start_seconds':6+i*.55,'duration_seconds':.45,'velocity':96,'articulation':'expressive_vibrato'} for i,n in enumerate(notes)]
          out='sample-bank-vsco2-flute/flute-audition.wav'
          report=render_sample_events(events,bank,out,sample_rate=44100)
          assert report['events_rendered']==len(events),report
          with wave.open(out,'rb') as w:
            assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(2,2,44100) and any(w.readframes(w.getnframes()))
          print('VSCO2_RECORDED_CONCERT_FLUTE_AUDITION_OK',report['sample_selection'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mehran-cc0-vsco2-concert-flute
          path: |
            sample-bank-vsco2-flute/bank.json
            sample-bank-vsco2-flute/LICENSE-CC0.txt
            sample-bank-vsco2-flute/provenance.json
            sample-bank-vsco2-flute/recordings/
            sample-bank-vsco2-flute/flute-audition.wav
          if-no-files-found: error
          retention-days: 30
